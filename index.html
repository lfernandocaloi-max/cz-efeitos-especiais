// Janelas próprias CZ: substituem alert/confirm/prompt do navegador.
function czDialog({titulo='CZ Efeitos Especiais',mensagem='',tipo='alerta',valor='',placeholder='',confirmar='OK',cancelar='Cancelar'}={}){
 return new Promise(resolve=>{
  document.getElementById('czDialogOverlay')?.remove();
  const ov=document.createElement('div');ov.id='czDialogOverlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200000;display:flex;align-items:center;justify-content:center;padding:18px';
  const box=document.createElement('div');box.style.cssText='width:min(520px,100%);background:#151b26;border:1px solid #30394a;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:22px;color:#fff';
  const campo=tipo==='prompt'?`<input id="czDialogInput" value="${esc(String(valor??''))}" placeholder="${esc(placeholder||'')}" style="width:100%;margin-top:14px;box-sizing:border-box;background:#0f141d;color:#fff;border:1px solid #384254;border-radius:10px;padding:12px;font-size:14px;outline:none">`:'';
  box.innerHTML=`<div style="font-size:12px;color:#ff641f;font-weight:900;letter-spacing:.8px">CZ EFEITOS ESPECIAIS</div><h3 style="margin:5px 0 12px;font-size:21px">${esc(titulo)}</h3><div style="white-space:pre-wrap;line-height:1.5;color:#dce2eb">${esc(String(mensagem||''))}</div>${campo}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">${tipo!=='alerta'?`<button id="czDialogCancelar" class="btn secondary" type="button">${esc(cancelar)}</button>`:''}<button id="czDialogOk" class="btn primary" type="button">${esc(confirmar)}</button></div>`;
  ov.appendChild(box);document.body.appendChild(ov);
  const fechar=v=>{ov.remove();resolve(v)};box.querySelector('#czDialogOk').onclick=()=>fechar(tipo==='prompt'?(box.querySelector('#czDialogInput')?.value??''):true);box.querySelector('#czDialogCancelar')?.addEventListener('click',()=>fechar(tipo==='prompt'?null:false));
  ov.onclick=e=>{if(e.target===ov&&tipo!=='alerta')fechar(tipo==='prompt'?null:false)};
  const inp=box.querySelector('#czDialogInput');if(inp){setTimeout(()=>{inp.focus();inp.select()},30);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();box.querySelector('#czDialogOk').click()}if(e.key==='Escape')box.querySelector('#czDialogCancelar')?.click()}}
  else setTimeout(()=>box.querySelector('#czDialogOk')?.focus(),30);
 });
}
function czAlert(mensagem,titulo='Aviso'){return czDialog({titulo,mensagem,tipo:'alerta',confirmar:'OK'})}
function czConfirm(mensagem,titulo='Confirmação',confirmar='Confirmar'){return czDialog({titulo,mensagem,tipo:'confirmar',confirmar,cancelar:'Cancelar'})}

let modoRecuperacao = false;

  if (event === 'PASSWORD_RECOVERY') {

  if (session) {

  } else {

async function salvarNovaSenha(){
  const senha = $('#novaSenha').value;
  const confirmar = $('#confirmarSenha').value;
  const msg = $('#novaSenhaMsg');

  if (!senha || !confirmar) {
    msg.textContent = 'Preencha os dois campos.';
    return;
  }

  if (senha.length < 6) {
    msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    return;
  }

  if (senha !== confirmar) {
    msg.textContent = 'As senhas não são iguais.';
    return;
  }

  msg.textContent = 'Salvando nova senha...';

  const {error} = await db.auth.updateUser({
    password: senha
  });

  if (error) {
    msg.textContent = 'Erro: ' + error.message;
    return;
  }

  await db.auth.signOut();

  alert('Senha alterada com sucesso! Entre com sua nova senha.');
  window.location.href = 'https://cz-efeitos-especiais.vercel.app';
}

async function carregarCaixa(){
  try{
    if(!caixaImportado){
      const antigos=finLoad(FIN_MOV_KEY).filter(x=>x.id&&x.status==='pago'&&['entrada','saida'].includes(x.tipo)&&Number(x.valor)>0).map(movimentoCaixaLocal);
      for(let i=0;i<antigos.length;i+=100){const {error}=await db.from('caixa_movimentacoes').upsert(antigos.slice(i,i+100),{onConflict:'origem_id',ignoreDuplicates:true});if(error)throw error}
      caixaImportado=true;
    }
    const todos=[];for(let inicio=0;;inicio+=1000){const {data,error}=await db.from('caixa_movimentacoes').select('*').order('data',{ascending:true}).order('criado_em',{ascending:true}).range(inicio,inicio+999);if(error)throw error;todos.push(...(data||[]));if((data||[]).length<1000)break}

}

function idadeColaborador(data){
  if(!data)return null;
  const [ano,mes,dia]=data.split('-').map(Number),hoje=new Date();
  if(!ano||!mes||!dia)return null;
  let idade=hoje.getFullYear()-ano;
  if(hoje.getMonth()+1<mes||(hoje.getMonth()+1===mes&&hoje.getDate()<dia))idade--;
  return idade>=0&&idade<=120?idade:null;
}

  $('#vehicleSave').onclick=async()=>{
    const id=$('#vehicleId').value,nome=$('#vehicleName').value.trim(),placa=$('#vehiclePlate').value.trim().toUpperCase();

function atualizarPagamento(){
  const totalCent=Math.round(Number($('#orcInvestimento').dataset.valor||0)*100);
  const modo=document.querySelector('input[name="orcCondicaoPagamento"]:checked')?.value||'avista';
  $('#orcPagamentoVista').classList.toggle('hidden',modo!=='avista');
  $('#orcPagamentoContratual').classList.toggle('hidden',modo!=='contratual');
  $('#orcValorVista').value=money(totalCent/100);
  const credito=modo==='avista'&&$('#orcFormaPagamento').value==='Cartão de crédito';
  $('#orcCartaoBox').classList.toggle('hidden',!credito);
  $('#orcCartaoValores').classList.toggle('hidden',!credito);
  if(credito){
    const n=Number($('#orcParcelasCartao').value),base=Math.floor(totalCent/n);
    $('#orcCartaoValores').innerHTML='<div class="muted" style="margin-top:8px">'+Array.from({length:n},(_,i)=>`${i+1}ª parcela: ${money((i===n-1?totalCent-base*(n-1):base)/100)}`).join(' · ')+'</div>';
  }
  if(modo!=='contratual')return;
  const percent=Number($('#orcEntradaPercentual').value||0);
  const entradaCent=Math.round(totalCent*Math.min(100,Math.max(0,Number.isFinite(percent)?percent:0))/100);
  const restanteCent=totalCent-entradaCent,n=Number($('#orcParcelasContrato').value);
  $('#orcEntradaValor').value=money(entradaCent/100);
  $('#orcRestante').value=money(restanteCent/100);
  const limite=$('#orcData').value?finAddDays($('#orcData').value,-1):'';
  if(parcelasRestanteBase!==restanteCent||parcelasRestanteQtd!==n){
    const anteriores=[...document.querySelectorAll('.contract-installment')].map(l=>({data:l.querySelector('[data-parcela-data]')?.value,forma:l.querySelector('[data-parcela-forma]')?.value}));
    const base=Math.floor(restanteCent/n);
    $('#orcParcelasContratoLista').innerHTML=Array.from({length:n},(_,i)=>{
      const valor=(i===n-1?restanteCent-base*(n-1):base)/100;
      const data=anteriores[i]?.data||'';
      const forma=anteriores[i]?.forma||'PIX';
      const formas=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Transferência'];
      return `<div class="contract-installment"><b>${i+1}ª parcela</b><div class="field"><label>Valor (R$)</label><input data-parcela-valor type="number" min="0" step="0.01" value="${valor.toFixed(2)}" inputmode="decimal"></div><div class="field"><label>Data</label><input data-parcela-data type="date" value="${esc(data)}" ${limite?`max="${limite}"`:''}></div><div class="field"><label>Forma de pagamento</label><select data-parcela-forma>${formas.map(f=>`<option ${forma===f?'selected':''}>${f}</option>`).join('')}</select></div></div>`;
    }).join('');
    parcelasRestanteBase=restanteCent;parcelasRestanteQtd=n;
  }
  document.querySelectorAll('[data-parcela-data]').forEach(c=>{if(limite)c.max=limite;else c.removeAttribute('max')});
  atualizarSomaParcelas();
}
function atualizarSomaParcelas(){
  const restanteCent=Math.round(Number($('#orcInvestimento').dataset.valor||0)*100)-Math.round(Number($('#orcEntradaPercentual').value||0)*Number($('#orcInvestimento').dataset.valor||0));
  const somaCent=[...document.querySelectorAll('[data-parcela-valor]')].reduce((s,c)=>s+Math.round(Number(c.value||0)*100),0);
  const diferenca=restanteCent-somaCent;
  const avisos=[];
  const entrada=$('#orcDataEntrada').value,evento=$('#orcData').value;
  const limite=evento?finAddDays(evento,-1):'';
  const datas=[...document.querySelectorAll('[data-parcela-data]')].map(c=>c.value);
  if(!evento)avisos.push('Informe a data do evento para definir o limite das parcelas.');
  if(entrada&&limite&&entrada>=limite)avisos.push(`A entrada é em ${finDate(entrada)} e o evento é em ${finDate(evento)}; não há data disponível depois da entrada e antes do evento.`);
  const foraPrazo=datas.findIndex(d=>d&&limite&&d>limite);
  if(foraPrazo>=0)avisos.push(`A ${foraPrazo+1}ª parcela está em ${finDate(datas[foraPrazo])}. Escolha até ${finDate(limite)} (um dia antes do evento).`);
  if(diferenca!==0)avisos.push(`Ajuste os valores das parcelas: diferença de ${money(Math.abs(diferenca)/100)} ${diferenca>0?'a distribuir':'acima do restante'}.`);
  $('#orcPagamentoMsg').textContent=avisos.join(' ');
}

  function dadosProposta(){

    })).filter(x=>x.nome||x.diarias||x.valor_diaria||x.alimentacao||x.estadia);
    const totalEquipe=equipe.reduce((s,x)=>s+(x.valor_diaria*x.diarias)+(x.alimentacao*x.diarias)+(x.estadia*x.diarias),0);
    const deslocamento=(Number($('#orcKm').value||0)*Number($('#orcValorKm').value||0))+Number($('#orcPedagio').value||0);
    const totalItens=[...itensProduto,...itensAtivo].reduce((s,x)=>s+(x.quantidade*x.preco),0);
    const maoObraCZ=Number($('#orcMaoObraCZ')?.value||0);
    const subtotal=Number((totalEquipe+deslocamento+totalItens+maoObraCZ).toFixed(2));
    const descontoPercentual=Number($('#orcDescontoPercentual').value||0);

    const parcelasDetalhes=modo==='contratual'?[...document.querySelectorAll('.contract-installment')].map((l,i)=>{const valor=l.querySelector('[data-parcela-valor]').value;return {numero:i+1,valor:valor===''?null:Number(valor),data:l.querySelector('[data-parcela-data]').value,forma:l.querySelector('[data-parcela-forma]').value}}):[];

      mao_obra_cz:maoObraCZ,subtotal,desconto_percentual:descontoPercentual,desconto_valor:descontoValor,total
    };

  function validarProposta(d){
    if(!d.cliente_id||!d.cliente||!d.telefone)return 'Selecione um cliente cadastrado com nome e telefone.';
    if(!d.evento)return 'Informe o nome do projeto/evento.';
    if(!d.data_evento)return 'Informe a data do evento.';
    if(!d.validade_orcamento)return 'Informe a validade do orçamento.';
    if(!d.produtos.length&&!d.equipamentos.length)return 'Adicione pelo menos um produto ou equipamento.';
    if(!Number.isFinite(d.desconto_percentual)||d.desconto_percentual<0||d.desconto_percentual>100)return 'Informe um desconto entre 0% e 100%.';
    if(d.pagamento.modo==='contratual'){
      const p=d.pagamento,limite=finAddDays(d.data_evento,-1);
      if(!Number.isFinite(p.entrada_percentual)||p.entrada_percentual<0||p.entrada_percentual>100)return 'Informe a entrada entre 0% e 100%.';
      if(!p.data_entrada)return 'Informe a data de pagamento da entrada.';
      if(p.data_entrada>=limite)return `A entrada é em ${finDate(p.data_entrada)} e o evento é em ${finDate(d.data_evento)}. Escolha uma data de evento que permita as parcelas antes dele.`;
      if(!p.parcelas_detalhes.length)return 'Selecione as parcelas do restante.';
      if(p.parcelas_detalhes.some(x=>!Number.isFinite(x.valor)||x.valor<0||!x.data||!x.forma))return 'Preencha valor, data e forma de pagamento de cada parcela.';
      const parcelaForaPrazo=p.parcelas_detalhes.find(x=>x.data>limite);
      if(parcelaForaPrazo)return `A ${parcelaForaPrazo.numero}ª parcela está em ${finDate(parcelaForaPrazo.data)}. O limite é ${finDate(limite)}, um dia antes do evento.`;
      if(p.parcelas_detalhes[0].data<=p.data_entrada)return 'A primeira parcela deve vencer depois da entrada.';
      if(p.parcelas_detalhes.some((x,i)=>i>0&&x.data<p.parcelas_detalhes[i-1].data))return 'As datas das parcelas devem ficar em ordem.';
      const somaCent=p.parcelas_detalhes.reduce((v,x)=>v+Math.round(x.valor*100),0);
      if(somaCent!==Math.round(p.restante*100))return 'A soma das parcelas deve ser igual ao restante a pagar.';
    }
    return '';
  }

  function gerarPdfProposta(d,numero,paraEnvio=false){
    if(!window.jspdf?.jsPDF)throw new Error('Não foi possível carregar o gerador de PDF.');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=210,H=297;
    const produtos=Array.isArray(d.produtos)?d.produtos:[];
    const equipamentos=Array.isArray(d.equipamentos)?d.equipamentos:[];
    const imagemA4=(data)=>{
      const img=pdf.getImageProperties(data),rImg=img.width/img.height,rPag=W/H;
      let w,h,x,z;
      if(rImg>rPag){h=H;w=H*rImg;x=(W-w)/2;z=0}else{w=W;h=W/rImg;x=0;z=(H-h)/2}
      pdf.addImage(data,'JPEG',x,z,w,h,undefined,'FAST');
    };
    const marcaDagua=()=>{pdf.addImage(CZ_ORCAMENTO_MARCA_DAGUA,'JPEG',0,0,W,H,undefined,'FAST')};
    const ouro=[178,125,47],preto=[28,28,28],cinza=[115,115,115];
    const linhaTitulo=(n,titulo,y)=>{
      pdf.setTextColor(...preto);pdf.setFont('times','italic');pdf.setFontSize(16);
      pdf.text(n+'.  '+titulo,15,y);
      pdf.setDrawColor(...ouro);pdf.setLineWidth(.35);pdf.line(15,y+3,195,y+3);
      return y+12;
    };
    const campo=(rotulo,valor,y)=>{
      pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(...preto);pdf.text(rotulo+':',20,y);
      pdf.setTextColor(75,75,75);pdf.text(String(valor||'—'),58,y);
      pdf.setDrawColor(205,205,205);pdf.setLineWidth(.2);pdf.line(58,y+1,193,y+1);
      return y+8;
    };
    // CAPA: mantém a capa atual e apenas insere o nome automático do cadastro do cliente.
    imagemA4(CZ_ORCAMENTO_CAPA);
    const nomeClienteCapa=String(d.cliente||'').trim();
    if(nomeClienteCapa){
      pdf.setFont('times','italic');pdf.setFontSize(nomeClienteCapa.length>34?19:nomeClienteCapa.length>24?23:27);
      pdf.setTextColor(255,255,255);
      const nomeLinhas=pdf.splitTextToSize(nomeClienteCapa,160),centroY=151-((nomeLinhas.length-1)*5);
      nomeLinhas.forEach((linha,i)=>pdf.text(linha,W/2,centroY+(i*10),{align:'center'}));
    }
    // PÁGINA 2: modelo 2 escolhido — sem Deslocamento, sem Equipe e sem valores individuais.
    pdf.addPage();marcaDagua();
    pdf.setDrawColor(...ouro);pdf.setLineWidth(.45);pdf.line(12,15,198,15);
    pdf.setTextColor(...preto);pdf.setFont('times','italic');pdf.setFontSize(19);pdf.text('Proposta Comercial',15,29);
    pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.setTextColor(...ouro);pdf.text('ORÇAMENTO Nº '+String(numero),195,24,{align:'right'});
    pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(...preto);
    pdf.text('DATA: '+new Date().toLocaleDateString('pt-BR'),195,30,{align:'right'});
    pdf.text('VALIDADE: '+(d.validade_orcamento?finDate(d.validade_orcamento):'—'),195,35,{align:'right'});
    let y=49;
    y=linhaTitulo('1','Dados do Evento',y);
    const dataFmt=d.data_evento?new Date(d.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):'—';
    y=campo('Data do evento',dataFmt,y); y=campo('Local',d.local_evento||'—',y); y=campo('Cidade',d.cidade_evento||'—',y); y=campo('Horário',d.horario||'—',y); y=campo('Evento',d.evento||'—',y);
    y+=7;y=linhaTitulo('2','Produtos e Equipamentos',y);
    const linhas=[...produtos.map(x=>({nome:x.nome,qtd:x.quantidade})),...equipamentos.map(x=>({nome:x.nome,qtd:x.quantidade}))];
    pdf.setFillColor(246,239,227);pdf.rect(15,y-5,180,8,'F');pdf.setTextColor(...preto);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text('Descrição',105,y,{align:'center'});y+=8;
    const maxLinhas=Math.min(linhas.length,10);
    for(let i=0;i<Math.max(maxLinhas,5);i++){
      const x=linhas[i];
      if(x){const texto=(Number(x.qtd||0)>1?String(x.qtd)+'x ':'')+String(x.nome||'');pdf.text(pdf.splitTextToSize(texto,168)[0],19,y);}
      pdf.setDrawColor(210,210,210);pdf.line(15,y+3,195,y+3);y+=8;
    }
    if(linhas.length>10){pdf.setFontSize(8);pdf.setTextColor(...cinza);pdf.text('+'+(linhas.length-10)+' itens adicionais conforme proposta.',19,y);y+=7;}
    y+=5;y=linhaTitulo('3','Observações',y);
    pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(80,80,80);
    const obs=String(d.observacoes||d.observacao||'').trim();
    if(obs){const partes=pdf.splitTextToSize(obs,175).slice(0,4);pdf.text(partes,18,y);y+=Math.max(18,partes.length*6);}else{for(let i=0;i<3;i++){pdf.setDrawColor(210,210,210);pdf.line(18,y,193,y);y+=9;}}
    // Único valor destacado: total do investimento. Tarja curta, discreta e somente atrás do valor.
    const totalY=270;
    pdf.setTextColor(...preto);pdf.setFont('times','italic');pdf.setFontSize(18);pdf.text('Total de Investimento:',128,totalY,{align:'right'});
    pdf.setFillColor(55,55,55);pdf.roundedRect(132,totalY-10,63,15,2,2,'F');
    pdf.setTextColor(235,203,145);pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.text(money(d.total),190,totalY,{align:'right'});
    pdf.setDrawColor(...ouro);pdf.setLineWidth(.45);pdf.line(12,286,198,286);
    const nomeArquivo='proposta-'+String(numero).replace(/[^a-zA-Z0-9_-]/g,'-')+'-'+String(d.cliente||'cliente').replace(/[^a-zA-Z0-9_-]/g,'-')+'.pdf';
    if(paraEnvio)return {blob:pdf.output('blob'),nomeArquivo};
    pdf.save(nomeArquivo);
  }
  async function proximoNumeroProposta(){
    const {data,error}=await db.from('orcamentos').select('numero').order('criado_em',{ascending:false}).limit(200);
    if(error)throw error;
    let maior=0;
    (data||[]).forEach(x=>{const n=parseInt(String(x.numero||'').replace(/\D/g,''),10);if(Number.isFinite(n)&&n>maior)maior=n});
    return String(maior+1).padStart(3,'0');
  }
  async function salvarProposta(status='enviado'){
    const d=dadosProposta(),erro=validarProposta(d);if(erro)throw new Error(erro);
    const selecionados=[...document.querySelectorAll('.equipeNome')].map(c=>c.value).filter(Boolean);
    if(selecionados.length){
      const {data:atuais,error:erroEquipe}=await db.rpc('listar_colaboradores_ativos');
      if(erroEquipe)throw new Error('Não foi possível conferir os colaboradores ativos: '+erroEquipe.message);
      const ativos=new Set((atuais||[]).map(c=>String(c.id)));
      if(selecionados.some(id=>!ativos.has(id)))throw new Error('Um colaborador selecionado foi inativado. Abra novamente o orçamento e escolha outro.');
    }
    const numero=await proximoNumeroProposta();
    const payload={numero,status,cliente_nome:d.cliente,cliente_telefone:d.telefone||null,evento_nome:d.evento,data_evento:d.data_evento,local_evento:d.local_evento||null,valor_total:d.total,dados:d,criado_em:new Date().toISOString()};
    const {data,error}=await db.from('orcamentos').insert(payload).select('*').single();
    if(error)throw error;
    return {registro:data,d,numero};
  }

  async function clienteDaProposta(p){
    if(p.dados?.cliente_id){
      const {data,error}=await db.from('clientes').select('id,nome,telefone').eq('id',p.dados.cliente_id).maybeSingle();
      if(error)throw error;if(!data)throw new Error('O cliente deste orçamento não está mais na base de clientes.');return data;
    }
    const clientes=[];
    for(let offset=0;;offset+=1000){const {data,error}=await db.from('clientes').select('id,nome,telefone').order('id').range(offset,offset+999);if(error)throw error;clientes.push(...(data||[]));if((data||[]).length<1000)break}
    const tel=telefonePropostaWhats(p.cliente_telefone||p.dados?.telefone);
    let encontrados=tel?clientes.filter(c=>telefonePropostaWhats(c.telefone)===tel):[];
    if(!encontrados.length){const nome=String(p.cliente_nome||p.dados?.cliente||'').trim().toLocaleLowerCase('pt-BR');encontrados=nome?clientes.filter(c=>String(c.nome||'').trim().toLocaleLowerCase('pt-BR')===nome):[]}
    if(encontrados.length!==1)throw new Error(encontrados.length?'Há mais de um cliente correspondente. Confira o cadastro antes de enviar.':'Cliente não encontrado na base de clientes.');
    return encontrados[0];
  }
  async function enviarPropostaWhats(p,btn){
    if(btn.disabled)return;
    const msg=$('#orcEnvioMsg');if(msg){msg.textContent='Preparando PDF e conferindo telefone do cliente...';msg.style.color='var(--muted)'}
    btn.disabled=true;btn.setAttribute('aria-busy','true');
    const janela=window.open('about:blank','_blank');
    if(janela){janela.opener=null;janela.document.title='Preparando proposta';janela.document.body.textContent='Preparando a proposta para abrir no WhatsApp...'}
    try{
      if(!p.dados||typeof p.dados!=='object')throw new Error('Esta proposta não tem os dados salvos para gerar o PDF.');
      const cliente=await clienteDaProposta(p),telefone=telefonePropostaWhats(cliente.telefone);
      if(!/^\d{12,15}$/.test(telefone))throw new Error('Confira o telefone com DDD na base de clientes.');
      const {blob,nomeArquivo}=gerarPdfProposta(p.dados,p.numero||'sem-numero',true);
      const caminho=String(p.id)+'/'+crypto.randomUUID()+'/'+nomeArquivo;
      const {error:erroUpload}=await db.storage.from('propostas-pdf').upload(caminho,blob,{contentType:'application/pdf',upsert:false});
      if(erroUpload)throw new Error('Não foi possível salvar o PDF. Execute o SQL de envio de propostas. '+erroUpload.message);
      const {data:arquivo,error:erroLink}=await db.storage.from('propostas-pdf').createSignedUrl(caminho,604800,{download:nomeArquivo});
      if(erroLink||!arquivo?.signedUrl)throw new Error('Não foi possível preparar o link do PDF: '+(erroLink?.message||'link indisponível'));
      const texto=`Olá ${cliente.nome||''}! Segue a proposta ${p.numero||''} da CZ Efeitos Especiais para ${p.evento_nome||p.dados.evento||'seu evento'}.\n\nPDF da proposta:\n${arquivo.signedUrl}\n\nO link fica disponível por 7 dias.`;
      const url='https://wa.me/'+telefone+'?text='+encodeURIComponent(texto);
      if(janela&&!janela.closed)janela.location.replace(url);
      if(msg){msg.style.color='#55d884';msg.innerHTML='Proposta preparada. Confirme o envio no WhatsApp. <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" style="color:#7db9ff">Abrir conversa</a>'}
    }catch(err){if(janela&&!janela.closed)janela.close();if(msg){msg.style.color='#ff8b78';msg.textContent='Erro ao preparar proposta: '+(err.message||'Tente novamente.')}else alert(err.message)}
    finally{btn.disabled=false;btn.removeAttribute('aria-busy')}
  }

Obrigado!`;

  async function excluirProposta(id){
    if(!await czConfirm('Excluir esta proposta? Se existir um evento vinculado e ele ainda não estiver FINALIZADO, todo o processo operacional desse orçamento também será excluído. Eventos finalizados serão preservados.','Excluir proposta','Excluir'))return;
    try{
      const {data:orc,error:eo}=await db.from('orcamentos').select('id,dados').eq('id',id).single();
      if(eo)throw eo;
      const eventoId=orc?.dados?.evento_operacional_id||null;
      if(eventoId){
        const {data:ev,error:ee}=await db.from('eventos_operacionais').select('id,status,saida_baixada_em').eq('id',eventoId).maybeSingle();
        if(ee)throw ee;
        if(ev?.saida_baixada_em)throw new Error('A proposta está vinculada a um evento que já movimentou o estoque. Preserve o histórico do evento e da proposta.');
        if(ev&&ev.status!=='finalizado'){
          const {error:em}=await db.from('evento_materiais').delete().eq('evento_id',eventoId);
          if(em)throw em;
          const {error:ed}=await db.from('eventos_operacionais').delete().eq('id',eventoId);
          if(ed)throw ed;
        }
      }
      const {error}=await db.from('orcamentos').delete().eq('id',id);
      if(error)throw error;
      await carregarPropostasSalvas();
    }catch(error){alert('Não foi possível excluir a proposta: '+error.message)}
  }

async function deleteClient(id){if(!await czConfirm('Excluir este cliente?','Excluir cliente','Excluir'))return;const {error}=await db.from('clientes').delete().eq('id',id);if(error){alert('Não foi possível excluir: '+error.message);return}closeClient();renderClients()}
function safeHttpUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function moedaInputValor(v){const n=Number(v||0);return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function moedaInputNumero(v){const t=String(v??'').trim();if(!t)return 0;const limpo=t.replace(/\s/g,'').replace('R$','').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'');return Number(limpo)||0}
function aplicarMascaraMoeda(el){if(!el)return;const formatar=()=>{el.value=moedaInputValor(moedaInputNumero(el.value))};el.addEventListener('focus',()=>{if(moedaInputNumero(el.value)===0)el.value=''});el.addEventListener('blur',formatar);formatar()}
  function calcularPrecosProduto(){
  const custo = moedaInputNumero($('#productCost')?.value);
  const varejoPercent = Number($('#productRetailPercent')?.value || 0);
  const atacadoPercent = Number($('#productWholesalePercent')?.value || 0);

  const varejoLucro = custo * (varejoPercent / 100);
  const atacadoLucro = custo * (atacadoPercent / 100);

  if($('#productRetail')) $('#productRetail').value = (custo + varejoLucro).toFixed(2);
  if($('#productRetailProfit')) $('#productRetailProfit').value = varejoLucro.toFixed(2);

  if($('#productWholesale')) $('#productWholesale').value = (custo + atacadoLucro).toFixed(2);
  if($('#productWholesaleProfit')) $('#productWholesaleProfit').value = atacadoLucro.toFixed(2);
}

aplicarMascaraMoeda(document.getElementById('productCost'));
aplicarMascaraMoeda(document.getElementById('assetPurchaseValue'));
['productCost','productRetailPercent','productWholesalePercent'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', calcularPrecosProduto);
});
function atualizarLucroPeloValor(tipo){
  const custo=moedaInputNumero($('#productCost').value);
  const campoValor=tipo==='varejo'?'#productRetail':'#productWholesale';
  const campoPercent=tipo==='varejo'?'#productRetailPercent':'#productWholesalePercent';
  const campoLucro=tipo==='varejo'?'#productRetailProfit':'#productWholesaleProfit';
  const lucro=Number($(campoValor).value||0)-custo;
  $(campoLucro).value=lucro.toFixed(2);
  $(campoPercent).value=custo>0?((lucro/custo)*100).toFixed(2):'0';
}
$('#productRetail').addEventListener('input',()=>atualizarLucroPeloValor('varejo'));
$('#productWholesale').addEventListener('input',()=>atualizarLucroPeloValor('atacado'));
async function uploadPhoto(file,folder){if(!file)return null;if(file.size>5*1024*1024)throw new Error('A foto deve ter no máximo 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${folder}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('fotos').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;return db.storage.from('fotos').getPublicUrl(path).data.publicUrl}

  $('#productResults').onclick=e=>{

      $('#productResults').querySelectorAll('.product-actions').forEach(el=>el.classList.add('hidden'));

    }

    const etiqueta=e.target.closest('[data-print-label]');if(etiqueta){abrirEtiquetaProduto(etiqueta.dataset.printLabel);return}

function imprimirEtiquetasProduto(p,qtd){

  const d=area.contentDocument||area.contentWindow.document;

  d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:50mm 31mm;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}.label{width:50mm;height:31mm;padding:1.6mm 2mm 1mm;overflow:hidden;page-break-after:always;break-after:page;color:#000;background:#fff}.nome{font-size:10pt;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{font-size:7.3pt;line-height:1.15;margin-top:.4mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barcode{height:14mm;margin-top:1mm;display:flex;align-items:flex-end;justify-content:center}.barcode svg{width:100%;height:14mm}.label:after{content:'';display:block;height:1mm}@media print{html,body{width:50mm}.label:last-child{page-break-after:auto;break-after:auto}}</style></head><body>${etiquetas}</body></html>`);d.close();
  try{for(let i=0;i<qtd;i++)area.contentWindow.JsBarcode}catch(_){ }
  const script=d.createElement('script');script.src='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';script.onload=()=>{try{for(let i=0;i<qtd;i++)area.contentWindow.JsBarcode(d.getElementById('bc'+i),codigo,{format:'CODE128',displayValue:true,fontSize:11,height:48,margin:0,width:2.1});setTimeout(()=>{area.contentWindow.focus();area.contentWindow.print()},120)}catch(err){czAlert('Não foi possível gerar o código de barras: '+err.message,'Imprimir etiqueta')}};d.head.appendChild(script);
}
async function addPurchaseItem(id,btn){

  purchaseIds.add(id);btn.textContent='Na lista';$('#productActionMsg').textContent='Produto adicionado à Lista de compra.';
}
async function renderShoppingList(){
  const [compras,cadastro]=await Promise.all([
    db.from('lista_compras').select('*').order('criado_em',{ascending:false}),
    db.from('produtos').select('id,nome,marca,fornecedor,valor_custo,estoque_atual,estoque_minimo,codigo_barras')
  ]);
  if(compras.error||cadastro.error){$('#content').innerHTML=`<div class="msg">Erro ao carregar Lista de compra: ${esc((compras.error||cadastro.error).message)}</div>`;return}
  const porId=new Map((cadastro.data||[]).map(p=>[String(p.id),p]));
  const linhas=(compras.data||[]).map(item=>({...item,produto:porId.get(String(item.produto_id))}));
  $('#content').innerHTML=`<div class="sectionhead"><div><h2>Lista de compra</h2><div class="muted">${linhas.length} produto(s)</div></div><div class="actions"><button id="purchasePdf" type="button" class="btn primary" ${linhas.length?'':'disabled'}>Gerar PDF</button><button class="btn secondary" onclick="renderModule(5)">Ver Estoque</button></div></div><div id="purchaseMsg" class="msg" role="status"></div><div class="tablewrap">${linhas.length?`<table><thead><tr><th>Produto</th><th>Marca</th><th>Fornecedor</th><th>Qtd. para comprar</th><th>Última compra (un.)</th><th>Total último custo</th><th>Novo valor (un.)</th><th>Total compra atual</th><th>Ações</th></tr></thead><tbody>${linhas.map((item,i)=>{const p=item.produto;return `<tr data-purchase-row="${i}"><td>${esc(p?.nome||'Produto removido do cadastro')}</td><td>${esc(p?.marca||'—')}</td><td>${esc(p?.fornecedor||'—')}</td><td><input class="purchase-input" data-purchase-qty="${i}" type="number" min="0.01" step="0.01" value="${Number(item.quantidade??1)}" aria-label="Quantidade para comprar de ${esc(p?.nome||'produto')}"></td><td>${money(p?.valor_custo)}</td><td data-last-total="${i}"></td><td><input class="purchase-input" data-purchase-current="${i}" type="number" min="0" step="0.01" value="${item.valor_compra_atual??''}" placeholder="Preencher" aria-label="Novo valor unitário de ${esc(p?.nome||'produto')}"></td><td data-current-total="${i}"></td><td><button type="button" class="btn danger" data-remove-purchase="${esc(item.produto_id)}">Remover</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">A lista está vazia. Adicione produtos pelo Estoque.</div>'}</div><div class="card" style="margin-top:16px"><div>Total pelo último custo: <strong id="purchaseGrandLast">R$ 0,00</strong></div><div style="margin-top:8px">Total da compra atual: <strong id="purchaseGrandCurrent">R$ 0,00</strong> <span id="purchasePending" class="muted"></span></div></div>`;
  const pendentes=new Set();
  const atualizarTotais=()=>{
    let ultimo=0,atual=0,faltando=0;
    linhas.forEach((item,i)=>{
      const q=Number($(`[data-purchase-qty="${i}"]`).value);
      const raw=$(`[data-purchase-current="${i}"]`).value;
      const novo=raw===''?null:Number(raw);
      const anterior=Number(item.produto?.valor_custo||0);
      const quantidade=Number.isFinite(q)&&q>0?q:0;
      ultimo+=quantidade*anterior;
      $(`[data-last-total="${i}"]`).textContent=money(quantidade*anterior);
      if(novo===null||!Number.isFinite(novo)||novo<0){faltando++;$(`[data-current-total="${i}"]`).textContent='Pendente'}
      else {atual+=quantidade*novo;$(`[data-current-total="${i}"]`).textContent=money(quantidade*novo)}
    });
    $('#purchaseGrandLast').textContent=money(ultimo);
    $('#purchaseGrandCurrent').textContent=money(atual);
    $('#purchasePending').textContent=faltando?`(${faltando} preço(s) pendente(s))`:'';
  };
  $('#content').onclick=e=>{const btn=e.target.closest('[data-remove-purchase]');if(btn)removePurchaseItem(btn.dataset.removePurchase,btn)};
  $('#content').oninput=e=>{if(e.target.matches('[data-purchase-qty],[data-purchase-current]'))atualizarTotais()};
  $('#content').onchange=e=>{
    const input=e.target;
    const tipo=input.dataset.purchaseQty!==undefined?'quantidade':input.dataset.purchaseCurrent!==undefined?'valor_compra_atual':null;
    if(!tipo)return;
    const i=Number(tipo==='quantidade'?input.dataset.purchaseQty:input.dataset.purchaseCurrent);
    const item=linhas[i],raw=input.value;
    const valor=raw===''&&tipo==='valor_compra_atual'?null:Number(raw);
    if((tipo==='quantidade'&&(!Number.isFinite(valor)||valor<=0))||(valor!==null&&(!Number.isFinite(valor)||valor<0))){
      $('#purchaseMsg').textContent=tipo==='quantidade'?'Informe uma quantidade maior que zero.':'Informe um valor de compra válido.';
      input.value=item[tipo]??'';atualizarTotais();return;
    }
    input.disabled=true;
    const salvar=(async()=>{
      const {error}=await db.from('lista_compras').update({[tipo]:valor}).eq('produto_id',item.produto_id);
      input.disabled=false;
      if(error){$('#purchaseMsg').textContent='Erro ao salvar: '+error.message;input.value=item[tipo]??''}
      else {item[tipo]=valor;$('#purchaseMsg').textContent='Lista de compra atualizada.'}
      atualizarTotais();
    })();
    pendentes.add(salvar);salvar.finally(()=>pendentes.delete(salvar));
  };
  $('#purchasePdf').onclick=async()=>{await Promise.all([...pendentes]);gerarPdfCompras(linhas)};
  atualizarTotais();
}
function gerarPdfCompras(linhas){

  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const xs=[12,62,90,132,149,183,217,253],larguras=[48,26,40,15,32,32,34,32];
  const cabecalhos=['Produto','Marca','Fornecedor','Qtd.','Último un.','Novo un.','Total último','Total atual'];
  let y=0;
  function cabecalho(){
    pdf.setFillColor(22,31,42);pdf.rect(0,0,297,30,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(16);pdf.text('CZ Efeitos Especiais | Lista de compra',12,15);
    pdf.setFontSize(9);pdf.text(new Date().toLocaleString('pt-BR'),285,15,{align:'right'});
    pdf.setTextColor(30,35,40);pdf.setFontSize(8);pdf.setFont('helvetica','bold');

  }

  });
  if(y>177){pdf.addPage();cabecalho()}
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);

function projetoExecucaoMarkup(shapes=[]){
  const n=v=>Math.max(0,Math.min(900,Number(v)||0));
  return (Array.isArray(shapes)?shapes:[]).map((s,i)=>{
    const a=`data-shape-index="${i}" stroke="#bd6621" stroke-width="3"`;
    if(s.tipo==='retangulo')return `<rect ${a} x="${n(s.x)}" y="${n(s.y)}" width="${n(s.w)}" height="${n(s.h)}" fill="rgba(212,170,76,.12)"/>`;
    if(s.tipo==='linha')return `<line ${a} x1="${n(s.x1)}" y1="${n(s.y1)}" x2="${n(s.x2)}" y2="${n(s.y2)}"/>`;
    if(s.tipo==='circulo')return `<circle ${a} cx="${n(s.cx)}" cy="${n(s.cy)}" r="${n(s.r)}" fill="rgba(212,170,76,.12)"/>`;
    if(s.tipo==='texto')return `<text data-shape-index="${i}" x="${n(s.x)}" y="${n(s.y)}" fill="#17202a" font-size="19" font-family="Arial,sans-serif">${esc(String(s.texto||'').slice(0,120))}</text>`;
    return '';
  }).join('');
}

function configurarEditorProjeto(shapes){
  const svg=$('#tecProjeto');let ferramenta='selecionar',selecionado=-1,inicio=null,preview=null;
  const desenhar=()=>{svg.innerHTML=projetoExecucaoMarkup(preview?[...shapes,preview]:shapes);if(selecionado>=0)svg.querySelector(`[data-shape-index="${selecionado}"]`)?.setAttribute('stroke','#1671a8')};
  const ponto=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const t=p.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(0,Math.min(900,Math.round(t.x))),y:Math.max(0,Math.min(500,Math.round(t.y)))}};
  const figura=(a,b)=>ferramenta==='retangulo'?{tipo:'retangulo',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.max(12,Math.abs(a.x-b.x)),h:Math.max(12,Math.abs(a.y-b.y))}:ferramenta==='linha'?{tipo:'linha',x1:a.x,y1:a.y,x2:b.x,y2:b.y}:{tipo:'circulo',cx:a.x,cy:a.y,r:Math.max(8,Math.min(250,Math.hypot(a.x-b.x,a.y-b.y)))};
  svg.onpointerdown=async ev=>{const alvo=ev.target.closest('[data-shape-index]');if(ferramenta==='selecionar'){selecionado=alvo?Number(alvo.dataset.shapeIndex):-1;desenhar();return}if(ferramenta==='texto'){const label=await czPrompt('Escreva o nome ou observação neste ponto:','','Texto do projeto');if(label?.trim()){const p=ponto(ev);shapes.push({tipo:'texto',x:p.x,y:p.y,texto:label.trim().slice(0,120)});desenhar()}return}inicio=ponto(ev);svg.setPointerCapture(ev.pointerId)};
  svg.onpointermove=ev=>{if(inicio){preview=figura(inicio,ponto(ev));desenhar()}};
  svg.onpointerup=ev=>{if(!inicio)return;const fim=ponto(ev);if(Math.abs(fim.x-inicio.x)<4&&Math.abs(fim.y-inicio.y)<4){fim.x=Math.min(900,inicio.x+80);fim.y=Math.min(500,inicio.y+60)}shapes.push(figura(inicio,fim));inicio=null;preview=null;desenhar()};
  svg.onpointercancel=()=>{inicio=null;preview=null;desenhar()};
  document.querySelectorAll('[data-tec-tool]').forEach(btn=>btn.onclick=()=>{ferramenta=btn.dataset.tecTool;document.querySelectorAll('[data-tec-tool]').forEach(x=>x.classList.toggle('active',x===btn));selecionado=-1;desenhar()});
  $('#tecApagar').onclick=()=>{if(selecionado>=0){shapes.splice(selecionado,1);selecionado=-1;desenhar()}};
  desenhar();
}

function normalizarCodigoEvento(v){return String(v??'').replace(/[\r\n\t ]+/g,'').trim().toUpperCase()}
let bipagemEventoEmAndamento=false;
async function biparEvento(eventoId){
 const campo=$('#scanEvento'),msg=$('#scanMsg');
 if(bipagemEventoEmAndamento)return;
 const codigoLido=normalizarCodigoEvento(campo?.value);
 if(!codigoLido){if(msg)msg.textContent='Bipe ou digite um código.';campo?.focus();return}
 bipagemEventoEmAndamento=true;
 if(msg){msg.style.color='var(--muted)';msg.textContent='Conferindo '+codigoLido+'...'}
 try{
   const {data:mats,error}=await db.from('evento_materiais').select('*').eq('evento_id',eventoId).order('criado_em');
   if(error)throw error;
   let candidatos=(mats||[]).filter(m=>normalizarCodigoEvento(m.codigo)===codigoLido);

   // Compatibilidade com eventos antigos: se o código não foi gravado em evento_materiais,
   // confere o cadastro atual do produto/ativo pelo item_id e corrige o código do evento.
   if(!candidatos.length){
     const produtos=(mats||[]).filter(m=>m.tipo==='produto'&&m.item_id).map(m=>m.item_id);
     const ativos=(mats||[]).filter(m=>m.tipo==='ativo'&&m.item_id).map(m=>m.item_id);
     let codigos=new Map();
     if(produtos.length){const r=await db.from('produtos').select('id,codigo_barras').in('id',produtos);if(r.error)throw r.error;(r.data||[]).forEach(x=>codigos.set('produto:'+x.id,x.codigo_barras||''))}
     if(ativos.length){const r=await db.from('ativos').select('id,codigo_barras,codigo_interno').in('id',ativos);if(r.error)throw r.error;(r.data||[]).forEach(x=>codigos.set('ativo:'+x.id,x.codigo_barras||x.codigo_interno||''))}
     candidatos=(mats||[]).filter(m=>normalizarCodigoEvento(codigos.get(m.tipo+':'+m.item_id))===codigoLido);
     for(const m of candidatos){if(!normalizarCodigoEvento(m.codigo)){await db.from('evento_materiais').update({codigo:codigos.get(m.tipo+':'+m.item_id)}).eq('id',m.id)}}
   }

   const item=candidatos.find(m=>Number(m.quantidade_bipada||0)<Number(m.quantidade_necessaria||0));
   if(!item){
     if(msg){msg.style.color='#ffb0b0';msg.textContent=candidatos.length?'Quantidade deste item já está completa.':'Código '+codigoLido+' não pertence aos materiais deste evento.'}
     campo?.select();campo?.focus();return;
   }
   const novo=Number(item.quantidade_bipada||0)+1;
   const {data:salvo,error:up}=await db.from('evento_materiais').update({quantidade_bipada:novo}).eq('id',item.id).select('id,quantidade_bipada').maybeSingle();
   if(up)throw up;
   if(!salvo)throw new Error('O banco não autorizou a atualização deste material. Verifique as permissões da tabela evento_materiais.');
   if(Number(salvo.quantidade_bipada)!==novo)throw new Error('A quantidade não foi gravada corretamente no banco.');
   try{localStorage.setItem('cz_conf_'+item.id,new Date().toISOString())}catch(_){}
   if(campo)campo.value='';
   await abrirEvento(eventoId);
 }catch(err){
   if(msg){msg.style.color='#ffb0b0';msg.textContent='Erro na conferência: '+(err?.message||err)}
   else alert('Erro na conferência: '+(err?.message||err));
   campo?.focus();
 }finally{bipagemEventoEmAndamento=false}
}

async function excluirEventoFinalizado(id){
 if(!contaMaster()){alert('Somente a conta Master pode excluir eventos finalizados.');return}
 const {data:ev,error:evErro}=await db.from('eventos_operacionais').select('id,nome_evento,origem_orcamento_id,status,saida_baixada_em').eq('id',id).maybeSingle();
 if(evErro){alert('Não foi possível verificar o evento: '+evErro.message);return}
 if(!ev){alert('Evento não encontrado.');return}
 if(ev.status!=='finalizado'){return excluirEvento(id,'retorno')}
 const nome=ev.nome_evento||'este evento',orcId=ev.origem_orcamento_id||null;
 if(!await czConfirm(`Excluir definitivamente ${nome}?\n\nTambém serão desfeitas as movimentações financeiras vinculadas a este evento. Esta ação não poderá ser desfeita.`,'Excluir evento finalizado','Excluir e desfazer financeiro'))return;
 try{
   if(orcId){
     const {error:cx}=await db.from('caixa_movimentacoes').delete().eq('orcamento_id',orcId);
     if(cx)throw new Error('Financeiro/Caixa: '+cx.message);
     const movs=finLoad(FIN_MOV_KEY).filter(x=>String(x.orcamento_id||'')!==String(orcId));
     finSave(FIN_MOV_KEY,movs);
     const cobs=finLoad(FIN_COB_KEY).filter(x=>String(x.orcamento_id||'')!==String(orcId));
     finSave(FIN_COB_KEY,cobs);
   }
   // Evento finalizado já teve o retorno concluído. A trava do banco impede remover
   // materiais enquanto a saída permanece marcada como baixada. Para uma exclusão
   // deliberada da conta Master, retiramos essa trava somente deste evento antes
   // de apagar seus vínculos. Isso não altera a proteção dos demais eventos.
   if(ev.saida_baixada_em){
     const {error:estorno}=await db.from('eventos_operacionais').update({saida_baixada_em:null,atualizado_em:new Date().toISOString()}).eq('id',id);
     if(estorno)throw new Error('Não foi possível liberar o histórico de saída para exclusão: '+estorno.message);
   }
   const {error:merr}=await db.from('evento_materiais').delete().eq('evento_id',id);
   if(merr){
     if(ev.saida_baixada_em)await db.from('eventos_operacionais').update({saida_baixada_em:ev.saida_baixada_em,atualizado_em:new Date().toISOString()}).eq('id',id);
     throw new Error('Materiais do evento: '+merr.message);
   }
   const {error:derr}=await db.from('eventos_operacionais').delete().eq('id',id);
   if(derr)throw new Error('Evento: '+derr.message);
   caixaCache=[];caixaImportado=false;
   await carregarCaixa();
   alert('Evento finalizado excluído e financeiro vinculado desfeito.');
   renderRetornoEventos(true);
 }catch(err){alert('Não foi possível excluir o evento finalizado: '+err.message)}
}
async function excluirEvento(id,origem='eventos'){

 if(evErro){alert('Não foi possível verificar o evento: '+evErro.message);return}
 if(ev?.saida_baixada_em){alert('Este evento já movimentou o estoque. Mantenha o histórico para preservar as quantidades.');return}
 const nome=ev?.nome_evento||'este evento';
 if(!await czConfirm(`Excluir definitivamente ${nome}? Esta ação não poderá ser desfeita.`,'Excluir definitivamente','Excluir'))return;

const CZ_OS_KEY='cz_ordens_manutencao_v83';

function czOsNumero(){const a=czOsLoad(),n=a.reduce((m,x)=>Math.max(m,Number(String(x.numero||'').replace(/\D/g,''))||0),0)+1;return 'OS '+String(n).padStart(3,'0')}

async function czAjustarQuantidadeAtivo(ativoId,delta,status){if(!ativoId)return true;const {data:a,error}=await db.from('ativos').select('*').eq('id',ativoId).single();if(error){alert(error.message);return false}const atual=Number(a.quantidade||0),nova=Math.max(0,atual+Number(delta||0));const patch={quantidade:nova};if('status' in a)patch.status=nova>0?'disponivel':status;const u=await db.from('ativos').update(patch).eq('id',ativoId);if(u.error){alert(u.error.message);return false}return true}
async function czCriarOS(eventoId,m,ativoId,qtd,ocorrencia){let ativo={};if(ativoId){const r=await db.from('ativos').select('*').eq('id',ativoId).maybeSingle();ativo=r.data||{}}const os={id:crypto.randomUUID(),numero:czOsNumero(),evento_id:eventoId,material_id:m.id,ativo_id:ativoId||'',equipamento:m.nome_item||ativo.nome||'Ativo',codigo:m.codigo||ativo.codigo_barras||ativo.codigo_interno||'',fabricante:ativo.fabricante||'',marca:ativo.marca||'',quantidade:qtd,ocorrencia,criado_em:new Date().toISOString(),status:'aguardando',inicio_em:'',conclusao_em:'',pecas:[],servico:''};const a=czOsLoad();a.push(os);czOsSave(a);return os}
async function registrarOcorrenciaRetorno(eventoId,mid,ativoId,tipo){
 const mr=await db.from('evento_materiais').select('*').eq('id',mid).single();if(mr.error){alert(mr.error.message);return}const m=mr.data,esperado=Number(m.quantidade_bipada||0),r=retornoInfo(mid),jaDev=Number(r.qtd||0),jaOc=Number(r.qtd_perda||0)+Number(r.qtd_manutencao||0),restante=Math.max(0,esperado-jaDev-jaOc);if(restante<=0){alert('Toda a quantidade deste ativo já foi tratada no retorno.');return}
 const qtd=Number(await czPrompt(`Quantidade para ${tipo==='perda'?'PERDA':'MANUTENÇÃO'} (máximo ${restante}):`,'1',tipo==='perda'?'Registrar perda':'Enviar para manutenção'));if(!Number.isInteger(qtd)||qtd<=0||qtd>restante){alert('Informe uma quantidade inteira entre 1 e '+restante+'.');return}
 if(tipo==='perda'&&!await czConfirm(`Confirmar a perda de ${qtd} unidade(s)?`,'Registrar perda','Confirmar perda'))return;
 let ocorrencia='';if(tipo==='manutencao'){ocorrencia=(await czPrompt('Ocorrência / o que aconteceu com o equipamento:','','Ocorrência de manutenção'))||'';if(!ocorrencia.trim()){alert('Informe a ocorrência para gerar a ordem de manutenção.');return}}
 if(!(await czAjustarQuantidadeAtivo(ativoId,-qtd,tipo==='perda'?'perdido':'manutencao')))return;
 if(tipo==='perda')r.qtd_perda=Number(r.qtd_perda||0)+qtd;else r.qtd_manutencao=Number(r.qtd_manutencao||0)+qtd;r.status=(jaDev+Number(r.qtd_perda||0)+Number(r.qtd_manutencao||0)>=esperado)?tipo:'parcial';salvarRetorno(mid,r);
 if(tipo==='manutencao'){const os=await czCriarOS(eventoId,m,ativoId,qtd,ocorrencia);if(await czConfirm(`${os.numero} gerada. Deseja imprimir a ordem agora?`,'Ordem de manutenção','Imprimir ordem'))imprimirOSManutencao(os.id)}
 abrirRetornoEvento(eventoId)
}

 if(mr.error){alert(mr.error.message);return}
 const m=mr.data,esperado=Number(m.quantidade_bipada||0),r=retornoInfo(mid),jaDev=Number(r.qtd||0),jaOc=Number(r.qtd_perda||0)+Number(r.qtd_manutencao||0),restante=Math.max(0,esperado-jaDev-jaOc);
 if(restante<=0){alert('Toda a quantidade deste ativo já foi tratada no retorno.');return}
 let ativo={};if(ativoId){const ar=await db.from('ativos').select('*').eq('id',ativoId).maybeSingle();ativo=ar.data||{}}
 let modal=$('#czManModal');if(modal)modal.remove();

 modal.innerHTML=`<div class="modalbox" style="width:min(720px,100%)"><div class="sectionhead"><div><h2 style="margin:0">🛠️ Enviar para manutenção</h2><div class="muted">Preencha a ocorrência e a quantidade para gerar a ordem.</div></div><button class="btn secondary" onclick="fecharModalManutencao()">Fechar</button></div><div class="row"><div class="field"><label>Código</label><input value="${esc(m.codigo||ativo.codigo_barras||ativo.codigo_interno||'')}" disabled></div><div class="field"><label>Ativo</label><input value="${esc(m.nome_item||ativo.nome||'Ativo')}" disabled></div></div><div class="row"><div class="field"><label>Quantidade da saída</label><input value="${esperado}" disabled></div><div class="field"><label>Quantidade disponível para ocorrência</label><input value="${restante}" disabled></div></div><div class="field"><label>Ocorrência *</label><textarea id="czManOcorrencia" placeholder="Descreva o que aconteceu com o equipamento"></textarea></div><div class="field"><label>Quantidade para manutenção *</label><input id="czManQtd" type="number" min="1" max="${restante}" step="1" value="1" placeholder="Digite a quantidade"></div><div class="muted" style="margin-top:-6px;margin-bottom:10px">A quantidade informada será descontada automaticamente da quantidade já bipada na saída.</div><div class="actions"><button class="btn secondary" onclick="gerarOSModalManutencao('${eventoId}','${mid}','${ativoId||''}',true)">🖨️ IMPRIMIR ORDEM</button><button class="btn primary" onclick="gerarOSModalManutencao('${eventoId}','${mid}','${ativoId||''}',false)">MANDAR PARA MANUTENÇÃO</button></div><div id="czManMsg" class="msg"></div></div>`;
 document.body.appendChild(modal);setTimeout(()=>$('#czManOcorrencia')?.focus(),50);
}

async function gerarOSModalManutencao(eventoId,mid,ativoId,imprimir){
 const msg=$('#czManMsg'),ocorrencia=String($('#czManOcorrencia')?.value||'').trim(),qtd=Number($('#czManQtd')?.value||0);
 const mr=await db.from('evento_materiais').select('*').eq('id',mid).single();if(mr.error){if(msg)msg.textContent=mr.error.message;return}
 const m=mr.data,esperado=Number(m.quantidade_bipada||0),r=retornoInfo(mid),jaDev=Number(r.qtd||0),jaOc=Number(r.qtd_perda||0)+Number(r.qtd_manutencao||0),restante=Math.max(0,esperado-jaDev-jaOc);
 if(!ocorrencia){if(msg)msg.textContent='Informe a ocorrência.';return}
 if(!Number.isInteger(qtd)||qtd<=0||qtd>restante){if(msg)msg.textContent='Informe uma quantidade entre 1 e '+restante+'.';return}
 if(!(await czAjustarQuantidadeAtivo(ativoId,-qtd,'em_manutencao')))return;
 r.qtd_manutencao=Number(r.qtd_manutencao||0)+qtd;r.status=(jaDev+Number(r.qtd_perda||0)+Number(r.qtd_manutencao||0)>=esperado)?'manutencao':'parcial';salvarRetorno(mid,r);
 const os=await czCriarOS(eventoId,m,ativoId,qtd,ocorrencia);fecharModalManutencao();if(imprimir)imprimirOSManutencao(os.id);abrirRetornoEvento(eventoId);
}
function marcarPerdaRetorno(eventoId,mid,ativoId){return registrarOcorrenciaRetorno(eventoId,mid,ativoId,'perda')}

function imprimirOSManutencao(id){const os=czOsLoad().find(x=>x.id===id);if(!os)return;const w=window.open('','_blank');if(!w){alert('Permita pop-ups para imprimir a ordem.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(os.numero)}</title><style>body{font-family:Arial;padding:28px;color:#111}h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:22px 0}.box{border:1px solid #bbb;padding:12px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:7px;text-align:left}</style></head><body><h1>CZ Efeitos Especiais</h1><h2>Ordem de Manutenção — ${esc(os.numero)}</h2><div class="grid"><div><b>Equipamento:</b> ${esc(os.equipamento)}</div><div><b>Código:</b> ${esc(os.codigo||'—')}</div><div><b>Fabricante:</b> ${esc(os.fabricante||'—')}</div><div><b>Marca:</b> ${esc(os.marca||'—')}</div><div><b>Quantidade:</b> ${os.quantidade}</div><div><b>Status:</b> ${esc(os.status)}</div><div><b>Abertura:</b> ${new Date(os.criado_em).toLocaleString('pt-BR')}</div><div><b>Conclusão:</b> ${os.conclusao_em?new Date(os.conclusao_em).toLocaleString('pt-BR'):'—'}</div></div><div class="box"><b>Ocorrência</b><div>${esc(os.ocorrencia||'—')}</div></div><div class="box"><b>Serviço realizado</b><div>${esc(os.servico||'—')}</div></div><h3>Peças / materiais usados</h3><table><thead><tr><th>Peça</th><th>Qtd.</th><th>Valor un.</th><th>Total</th></tr></thead><tbody>${(os.pecas||[]).map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.quantidade}</td><td>${money(x.valor)}</td><td>${money(Number(x.quantidade)*Number(x.valor))}</td></tr>`).join('')||'<tr><td colspan="4">Nenhuma peça registrada.</td></tr>'}</tbody></table><h3 style="text-align:right">Custo total técnico: ${money(czOsTotal(os))}</h3><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function renderManutencao(modo='abertas'){window.czManModo=modo;const todas=czOsLoad().sort((x,y)=>String(y.criado_em).localeCompare(String(x.criado_em))),a=todas.filter(x=>modo==='historico'?x.status==='concluida':x.status!=='concluida');$('#content').innerHTML=`<div class="sectionhead"><div><h2>🛠️ Manutenção</h2><div class="muted">${modo==='historico'?'Histórico das ordens já concluídas':'Somente ordens que ainda estão em aberto'}</div></div><div class="actions" style="margin-top:0"><button class="btn ${modo==='abertas'?'primary':'secondary'}" onclick="renderManutencao('abertas')">EM ABERTO</button><button class="btn ${modo==='historico'?'primary':'secondary'}" onclick="renderManutencao('historico')">HISTÓRICO</button></div></div>${modo==='historico'?`<div class="card" style="margin-bottom:14px"><div class="row"><div class="field"><label>Data inicial</label><input id="manHistIni" type="date" onchange="filtrarHistoricoManutencao()"></div><div class="field"><label>Data final</label><input id="manHistFim" type="date" onchange="filtrarHistoricoManutencao()"></div></div><div class="row"><div class="field"><label>Ativo / equipamento</label><input id="manHistAtivo" placeholder="Pesquisar nome" oninput="filtrarHistoricoManutencao()"></div><div class="field"><label>Nº OS ou código</label><input id="manHistBusca" placeholder="OS 001 ou código" oninput="filtrarHistoricoManutencao()"></div></div></div>`:''}<div class="tablewrap"><table><thead><tr><th>OS</th><th>Data</th><th>Equipamento</th><th>Código</th><th>Qtd.</th><th>Ocorrência</th><th>Status</th><th>Custo</th><th>Ações</th></tr></thead><tbody id="manTabelaBody">${linhasManutencao(a,modo)}</tbody></table></div>`}
function linhasManutencao(a,modo){return a.map(os=>`<tr data-data="${String(os.conclusao_em||os.criado_em||'').slice(0,10)}" data-ativo="${esc(String(os.equipamento||'').toLowerCase())}" data-busca="${esc((String(os.numero||'')+' '+String(os.codigo||'')).toLowerCase())}"><td><b>${esc(os.numero)}</b></td><td>${new Date(os.conclusao_em||os.criado_em).toLocaleDateString('pt-BR')}</td><td>${esc(os.equipamento)}</td><td>${esc(os.codigo||'—')}</td><td>${os.quantidade}</td><td>${esc(os.ocorrencia)}</td><td>${os.status==='aguardando'?'Aguardando manutenção':os.status==='andamento'?'Em manutenção':os.status==='aguardando_material'?'Aguardando peça/material':'Concluída'}</td><td>${money(czOsTotal(os))}</td><td><button class="btn secondary" onclick="abrirOSManutencao('${os.id}')">Abrir</button> <button class="btn secondary" onclick="imprimirOSManutencao('${os.id}')">Imprimir</button></td></tr>`).join('')||`<tr><td colspan="9">${modo==='historico'?'Nenhuma manutenção concluída.':'Nenhuma manutenção em aberto.'}</td></tr>`}
function filtrarHistoricoManutencao(){const ini=$('#manHistIni')?.value||'',fim=$('#manHistFim')?.value||'',ativo=String($('#manHistAtivo')?.value||'').trim().toLowerCase(),busca=String($('#manHistBusca')?.value||'').trim().toLowerCase();document.querySelectorAll('#manTabelaBody tr[data-data]').forEach(tr=>{const d=tr.dataset.data||'',ok=(!ini||d>=ini)&&(!fim||d<=fim)&&(!ativo||(tr.dataset.ativo||'').includes(ativo))&&(!busca||(tr.dataset.busca||'').includes(busca));tr.style.display=ok?'':'none'})}

></div><h3 style="text-align:right">Total da manutenção: ${money(czOsTotal(os))}</h3><div class="field"><label>Serviço realizado</label><textarea id="osServico" ${os.status==='concluida'?'disabled':''}>${esc(os.servico||'')}</textarea></div>${os.status!=='concluida'?`<button class="btn secondary" onclick="salvarServicoOS('${os.id}')">Salvar serviço</button>`:''}</div>`}
function iniciarOSManutencao(id){const a=czOsLoad(),os=a.find(x=>x.id===id);if(!os)return;os.status='andamento';os.inicio_em=new Date().toISOString();czOsSave(a);abrirOSManutencao(id)}

// ===== V96 · ACESSOS SIMPLIFICADOS / COMPATÍVEL COM RLS =====
// Existem somente dois tipos visíveis no sistema:
// 1) Master -> acesso completo.
// 2) Frente de separação -> somente Eventos e Retorno de evento.
const CZ_ACOES=['ver','criar','editar','excluir'];
let czPerfilUsuario=null;
function czPermPadrao(){const p={};modules.forEach(m=>p[m]={ver:false,criar:false,editar:false,excluir:false});return p}
function czPermTudo(){const p=czPermPadrao();Object.values(p).forEach(x=>CZ_ACOES.forEach(a=>x[a]=true));return p}
function czPermFrente(){const p=czPermPadrao();['Eventos','Retorno de evento'].forEach(m=>{if(p[m])CZ_ACOES.forEach(a=>p[m][a]=true)});return p}
async function carregarPermissoesUsuario(){
 const email=String(currentAuthUser?.email||'').trim().toLowerCase();
 if(email===CZ_MASTER_EMAIL){czPerfilUsuario={email,nome:'Luiz Fernando Caloi',perfil:'master_principal',ativo:true,permissoes:czPermTudo()};return}
 try{let {data,error}=await db.from('usuarios_sistema').select('*').eq('user_id',currentAuthUser.id).maybeSingle();if(error)throw error;if(!data){const r=await db.from('usuarios_sistema').select('*').ilike('email',email).maybeSingle();if(r.error)throw r.error;data=r.data;if(data&&!data.user_id){await db.from('usuarios_sistema').update({user_id:currentAuthUser.id,atualizado_em:new Date().toISOString()}).eq('id',data.id);data.user_id=currentAuthUser.id}}czPerfilUsuario=data||{email,perfil:'usuario',ativo:false,permissoes:czPermFrente()}}catch(e){console.error('Erro ao carregar perfil CZ:',e);czPerfilUsuario={email,perfil:'usuario',ativo:false,permissoes:czPermFrente()}}
 if(czPerfilUsuario?.ativo===false){await czAlert('Seu usuário está inativo. Procure o Master do sistema.','Acesso bloqueado');await db.auth.signOut();showLogin();throw new Error('Usuário inativo')}
 // Migração compatível: perfis master antigos continuam sendo Master; qualquer outro perfil vira Frente.
 if(contaMaster()) czPerfilUsuario.permissoes=czPermTudo(); else czPerfilUsuario.permissoes=czPermFrente();
}

function pdvCadastrarClienteAgora(){

function pdvSelecionarClienteBase(valor){
  const v=String(valor||'').trim().toLowerCase();
  if(!v)return;
  const telBusca=v.replace(/\D/g,'');
  const c=pdvClientes.find(x=>{
    const rotulo=`${x.nome||''} — ${x.telefone||''}`.toLowerCase();
    const tel=String(x.telefone||'').replace(/\D/g,'');
    return rotulo===v || (telBusca.length>=8 && tel===telBusca);
  });
  if(!c)return;
  if($('#pdvClienteNome'))$('#pdvClienteNome').value=c.nome||'';
  if($('#pdvClienteTelefone'))$('#pdvClienteTelefone').value=c.telefone||'';
}
function pdvAtualizarLinhaProduto(){
  const id=$('#pdvProduto')?.value,tabela=$('#pdvTabela')?.value||'1',qtd=Math.max(1,Math.floor(Number($('#pdvQtd')?.value||1)));
  const p=pdvProdutos.find(x=>String(x.id)===String(id));
  const valor=p?Number(tabela==='2'?(p.valor_atacado||0):(p.valor_varejo||0)):0;
  if($('#pdvValorUnit'))$('#pdvValorUnit').value=p?money(valor):'';
  if($('#pdvValorLinha'))$('#pdvValorLinha').value=p?money(valor*qtd):'';
}

function pdvProximoNumero(){

async function pdvSalvarOrcamento(){
  if(pdvOrcamentoSalvando)return;
  const nome=$('#pdvClienteNome')?.value.trim(),telefone=$('#pdvClienteTelefone')?.value.trim()||'';
  if(!nome)return czAlert('Informe o nome do cliente.','Orçamento PDV');
  if(!pdvCarrinho.length)return czAlert('Adicione pelo menos um produto ao orçamento.','Orçamento PDV');
  const total=pdvCarrinho.reduce((s,x)=>s+x.qtd*x.valor,0),agora=new Date();
  pdvOrcamentoSalvando=true;
  const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()==='Salvar como orçamento');
  if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  try{
    const lista=pdvOrcamentos();
    const orc={id:crypto.randomUUID(),numero:pdvProximoNumero(),dataHora:agora.toLocaleString('pt-BR'),cliente:nome,telefone,forma:$('#pdvForma')?.value||'Pix',total,itens:pdvCarrinho.map(x=>({...x}))};
    lista.unshift(orc);
    pdvSalvarOrcamentos(lista); // um único salvamento por clique
    pdvImprimirOrcamentoPDF(orc);
    await czAlert('Orçamento salvo uma única vez e PDF gerado para impressão.','Orçamento salvo');
    pdvCarrinho=[];
    pdvMontarTela();
    pdvMostrarOrcamentos();
  }finally{
    pdvOrcamentoSalvando=false;
  }
}

function pdvImprimirOrcamentoPDF(orc){
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm',format:'a4'});
    let y=18;
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('CZ Efeitos Especiais',15,y);y+=8;
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('ORÇAMENTO PDV',15,y);y+=9;
    doc.setFontSize(10);
    doc.text(`Orçamento: ${orc.numero}`,15,y);y+=6;
    doc.text(`Cliente: ${orc.cliente}`,15,y);y+=6;
    doc.text(`Telefone: ${orc.telefone||'—'}`,15,y);y+=10;
    doc.setFont('helvetica','bold');
    doc.text('Produto',15,y);doc.text('Qtd.',105,y);doc.text('Tabela',122,y);doc.text('Unitário',145,y);doc.text('Total',175,y,{align:'right'});y+=5;
    doc.line(15,y,195,y);y+=6;
    doc.setFont('helvetica','normal');
    orc.itens.forEach(x=>{
      if(y>270){doc.addPage();y=18}
      const nome=String(x.nome||'').slice(0,42);
      doc.text(nome,15,y);
      doc.text(String(x.qtd),108,y,{align:'right'});
      doc.text(String(x.tabela||'1'),130,y,{align:'center'});
      doc.text(money(x.valor),165,y,{align:'right'});
      doc.text(money(x.qtd*x.valor),195,y,{align:'right'});
      y+=7;
    });
    y+=3;doc.line(15,y,195,y);y+=9;
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(`TOTAL: ${money(orc.total)}`,195,y,{align:'right'});
    y+=10;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Este documento é um orçamento e não realiza baixa de estoque até ser convertido em venda.',15,y);
    doc.save(`${orc.numero}.pdf`);
  }catch(e){
    czAlert('O orçamento foi salvo, mas não foi possível gerar o PDF: '+e.message,'PDF do orçamento');
  }
}
function pdvCarregarOrcamento(id){
  const o=pdvOrcamentos().find(x=>x.id===id);if(!o)return;
  pdvCarrinho=o.itens.map(x=>({...x}));pdvMostrarVenda();
  if($('#pdvClienteNome'))$('#pdvClienteNome').value=o.cliente||'';
  if($('#pdvClienteTelefone'))$('#pdvClienteTelefone').value=o.telefone||'';
  if($('#pdvForma'))$('#pdvForma').value=o.forma||'Pix';
  pdvAtualizarCarrinho();
}
async function pdvExcluirOrcamento(id){
  if(!await czConfirm('Excluir este orçamento do PDV?','Excluir orçamento','Excluir'))return;
  pdvSalvarOrcamentos(pdvOrcamentos().filter(x=>x.id!==id));pdvMostrarOrcamentos();
}
async function pdvVenderOrcamento(id){
  const o=pdvOrcamentos().find(x=>x.id===id);if(!o)return;
  pdvCarrinho=o.itens.map(x=>({...x}));pdvMostrarVenda();
  $('#pdvClienteNome').value=o.cliente||'';$('#pdvClienteTelefone').value=o.telefone||'';$('#pdvForma').value=o.forma||'Pix';pdvAtualizarCarrinho();
  if(!await czConfirm(`Gerar a venda do orçamento ${o.numero} no valor de ${money(o.total)}?`,'Converter orçamento em venda','Gerar venda')){pdvMostrarOrcamentos();return}
  const ok=await pdvFinalizar(id);
}
function pdvAdicionar(){
  const id=$('#pdvProduto')?.value,qtd=Math.max(1,Math.floor(Number($('#pdvQtd')?.value||1))),tabela=$('#pdvTabela')?.value||'1';
  const p=pdvProdutos.find(x=>String(x.id)===String(id));
  if(!p)return czAlert('Selecione um produto.','PDV');
  const valor=Number(tabela==='2'?(p.valor_atacado||0):(p.valor_varejo||0));
  const existente=pdvCarrinho.find(x=>String(x.id)===String(id)&&String(x.tabela)===String(tabela));
  const novaQtd=(existente?.qtd||0)+qtd;
  const qtdMesmoProduto=pdvCarrinho.filter(x=>String(x.id)===String(id)&&x!==existente).reduce((s,x)=>s+Number(x.qtd||0),0);
  if(novaQtd+qtdMesmoProduto>Number(p.estoque_atual||0))return czAlert(`Estoque insuficiente. Disponível: ${Number(p.estoque_atual||0)}.`,'PDV');
  if(existente)existente.qtd=novaQtd;
  else pdvCarrinho.push({id:p.id,nome:p.nome,qtd,valor,tabela,estoque:Number(p.estoque_atual||0),unidade:p.unidade||'un'});
  $('#pdvQtd').value=1;$('#pdvProduto').value='';$('#pdvTabela').value='1';pdvAtualizarLinhaProduto();pdvAtualizarCarrinho();
}

function pdvRemover(i){pdvCarrinho.splice(i,1);pdvAtualizarCarrinho()}

function pdvAtualizarCarrinho(){
  const area=$('#pdvCarrinho');if(!area)return;
  const total=pdvCarrinho.reduce((s,x)=>s+x.qtd*x.valor,0);
  area.innerHTML=pdvCarrinho.length?`<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Quantidade</th><th>Tabela</th><th>Valor unitário</th><th>Valor total</th><th></th></tr></thead><tbody>${pdvCarrinho.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${x.qtd}</td><td>Tabela ${esc(x.tabela||'1')}</td><td>${money(x.valor)}</td><td><b>${money(x.qtd*x.valor)}</b></td><td><button type="button" class="btn danger" onclick="pdvRemover(${i})">Remover</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum produto adicionado.</div>';
  if($('#pdvTotal'))$('#pdvTotal').textContent=money(total);
}

function pdvLimpar(){pdvCarrinho=[];pdvMontarTela()}

function pdvImprimirPedido(venda){
  const linhas=venda.itens.map(x=>`<tr><td>${esc(x.nome)}</td><td style="text-align:center">${x.qtd}</td><td style="text-align:center">Tabela ${esc(x.tabela||'1')}</td><td style="text-align:right">${money(x.valor)}</td><td style="text-align:right">${money(x.qtd*x.valor)}</td></tr>`).join('');
  const w=window.open('','_blank','width=820,height=900');
  if(!w){czAlert('O navegador bloqueou a janela de impressão. Libere pop-ups para imprimir o pedido.','Impressão');return}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Pedido PDV</title><style>body{font-family:Arial,sans-serif;color:#111;padding:28px;max-width:760px;margin:auto}h1{margin:0}small{color:#555}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{padding:9px;border-bottom:1px solid #ccc;text-align:left}th{background:#eee}.total{font-size:22px;font-weight:bold;text-align:right;margin-top:18px}.info{margin-top:16px;line-height:1.6}@media print{button{display:none}}</style></head><body><h1>CZ Efeitos Especiais</h1><small>Pedido de venda PDV</small><div class="info"><b>Pedido:</b> ${esc(venda.numero)}<br><b>Data:</b> ${esc(venda.dataHora)}<br><b>Cliente:</b> ${esc(venda.cliente)}<br><b>Telefone:</b> ${esc(venda.telefone||'—')}<br><b>Pagamento:</b> ${esc(venda.forma)}</div><table><thead><tr><th>Produto</th><th>Quantidade</th><th>Tabela</th><th>Valor unitário</th><th>Valor total</th></tr></thead><tbody>${linhas}</tbody></table><div class="total">Valor total: ${money(venda.total)}</div><script>window.onload=()=>{window.print()}<\/script></body></html>`);
  w.document.close();
}

async function pdvFinalizar(orcamentoPdvId=null){
  const nome=$('#pdvClienteNome')?.value.trim(),telefone=$('#pdvClienteTelefone')?.value.trim()||'',forma=$('#pdvForma')?.value||'Pix';
  if(!nome)return czAlert('Informe o nome do cliente.','PDV');
  if(!pdvCarrinho.length)return czAlert('Adicione pelo menos um produto ao pedido.','PDV');
  const total=pdvCarrinho.reduce((s,x)=>s+x.qtd*x.valor,0);
  if(total<=0)return czAlert('O valor total da venda precisa ser maior que zero.','PDV');
  if(!await czConfirm(`Finalizar a venda de ${money(total)} para ${nome}? O estoque será baixado, a venda irá para o Caixa e o cliente será vinculado à base de Clientes.`,'Finalizar venda','Finalizar'))return;
  const msg=$('#pdvMsg');msg.textContent='Finalizando venda...';
  const alterados=[];
  try{
    // Vincula o PDV à base de clientes sem duplicar telefone.
    // Compara somente os números para aceitar telefones formatados de maneiras diferentes.
    const telNormalizado=String(telefone||'').replace(/\D/g,'');
    let clienteExistente=null;
    if(telNormalizado){
      const {data:listaClientes,error:ce}=await db.from('clientes').select('*').limit(10000);
      if(ce)throw ce;
      clienteExistente=(listaClientes||[]).find(c=>String(c.telefone||'').replace(/\D/g,'')===telNormalizado)||null;
    }
    if(!clienteExistente){
      const novoCliente={
        nome,
        telefone:telefone||null,
        origem:'PDV',
        observacoes:'Cliente criado automaticamente pelo PDV.'
      };
      const {error:ci}=await db.from('clientes').insert(novoCliente);
      if(ci)throw ci;
    }
    for(const item of pdvCarrinho){
      const {data:p,error:pe}=await db.from('produtos').select('estoque_atual').eq('id',item.id).single();
      if(pe)throw pe;
      const atual=Number(p?.estoque_atual||0);
      if(atual<item.qtd)throw new Error(`Estoque insuficiente para ${item.nome}. Disponível: ${atual}.`);
      const novo=atual-item.qtd;
      const {error:ue}=await db.from('produtos').update({estoque_atual:novo,atualizado_em:new Date().toISOString()}).eq('id',item.id);
      if(ue)throw ue;
      alterados.push({id:item.id,estoque:atual});
    }
    const agora=new Date(),numero='PDV-'+String(agora.getFullYear())+String(agora.getMonth()+1).padStart(2,'0')+String(agora.getDate()).padStart(2,'0')+'-'+String(agora.getTime()).slice(-6);
    await registrarCaixa({origem_id:'pdv:'+crypto.randomUUID(),tipo:'entrada',data:finISODate(agora),valor:total,cliente_nome:nome,proposta_numero:numero,orcamento_id:null,descricao:'Venda PDV',categoria:'Venda PDV',forma,observacao:telefone?('Telefone: '+telefone):null});
    const venda={numero,dataHora:agora.toLocaleString('pt-BR'),cliente:nome,telefone,forma,total,itens:pdvCarrinho.map(x=>({...x}))};
    if(orcamentoPdvId)pdvSalvarOrcamentos(pdvOrcamentos().filter(x=>x.id!==orcamentoPdvId));
    await czAlert('Venda concluída. O estoque foi baixado e o recebimento ficou aguardando confirmação no Caixa.','Venda concluída');
    pdvImprimirPedido(venda);
    await renderPDV();
  }catch(e){
    for(const a of alterados){try{await db.from('produtos').update({estoque_atual:a.estoque,atualizado_em:new Date().toISOString()}).eq('id',a.id)}catch(_){}}
    msg.textContent='Erro: '+e.message;
  }
}

function czPode(modulo,acao='ver'){if(contaMaster())return true;return !!czPerfilUsuario?.permissoes?.[modulo]?.[acao]}
function reconstruirMenuPermissoes(){const botoes=ordemMenu.filter(i=>czPode(modules[i],'ver'));$('#nav').innerHTML=botoes.map((i,k)=>`<button data-i="${i}" class="${k===0?'active':''}">${modules[i]}</button>`).join('')}
const _renderModulePerm=renderModule;
renderModule=async function(i){const mod=modules[i];if(!czPode(mod,'ver')){await czAlert('A Frente de separação não tem acesso a este módulo.','Acesso restrito');return}return _renderModulePerm(i)};
function czPermCheck(mod,acao){if(czPode(mod,acao))return true;czAlert('A Frente de separação não tem permissão para esta ação.','Acesso restrito');return false}
function czTipoAcesso(u){return String(u?.email||'').toLowerCase()===CZ_MASTER_EMAIL||['master','master_principal','master_autorizado'].includes(String(u?.perfil||''))?'Master':'Frente de separação'}
async function renderUsuariosPermissoes(){
 if(!contaMaster())return czAlert('Somente Master pode administrar logins.','Acesso restrito');
 const {data,error}=await db.from('usuarios_sistema').select('*').order('nome',{ascending:true});
 if(error){$('#content').innerHTML=`<div class="msg">Erro ao carregar usuários: ${esc(error.message)}</div>`;return}
 const us=data||[];
 $('#content').innerHTML=`<div class="sectionhead"><div><h2>👥 Usuários</h2><div class="muted">V96 • Tipos de acesso: Master ou Frente de separação.</div></div><button class="btn primary" onclick="novoUsuarioSistema()">+ Novo usuário</button></div><div class="card" style="margin-bottom:16px"><b>Master protegido:</b> ${esc(CZ_MASTER_EMAIL)}<div class="muted" style="margin-top:6px">Este login não pode ser excluído.</div></div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Tipo de acesso</th><th>Status</th><th>Ações</th></tr></thead><tbody>${us.map(u=>{const principal=String(u.email||'').toLowerCase()===CZ_MASTER_EMAIL;return `<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email||'')}</td><td><b>${czTipoAcesso(u)}</b></td><td>${u.ativo?'🟢 Ativo':'🔴 Inativo'}</td><td><button class="btn secondary" onclick="editarPermissoesUsuario('${u.id}')">Editar</button>${principal?'':` <button class="btn danger" onclick="excluirLoginSistema('${u.id}','${String(u.email||'').replace(/'/g,"\\'")}')">Excluir login</button>`}</td></tr>`}).join('')||'<tr><td colspan="5">Nenhum usuário cadastrado.</td></tr>'}</tbody></table></div>`;
}
async function novoUsuarioSistema(){
 if(!contaMaster())return czAlert('Somente Master pode criar novos logins.','Acesso restrito');
 finModal('Novo usuário do sistema',[{name:'nome',label:'Nome do usuário',required:true,full:true},{name:'email',label:'E-mail / Login',type:'email',required:true,full:true},{name:'senha',label:'Senha inicial',type:'password',required:true},{name:'confirmar',label:'Confirmar senha',type:'password',required:true},{name:'tipo',label:'Tipo de acesso',type:'select',options:['Master','Frente de separação'],required:true,full:true}],async d=>{
  const nome=String(d.nome||'').trim(),email=String(d.email||'').trim().toLowerCase(),senha=String(d.senha||''),confirmar=String(d.confirmar||'');
  if(!nome)throw new Error('Informe o nome do usuário.');if(!email||!email.includes('@'))throw new Error('Informe um e-mail válido.');if(senha.length<6)throw new Error('A senha inicial precisa ter pelo menos 6 caracteres.');if(senha!==confirmar)throw new Error('As senhas não são iguais.');
  const perfil=d.tipo==='Master'?'master_autorizado':'usuario';
  const {data,error}=await db.functions.invoke('cz-criar-usuario',{body:{nome,email,senha,perfil}});if(error)throw new Error(error.message||'Não foi possível criar o login.');if(data?.error)throw new Error(data.error);
  const {error:pe}=await db.from('usuarios_sistema').update({permissoes:perfil==='master_autorizado'?czPermTudo():czPermFrente()}).eq('email',email);if(pe)throw new Error('Login criado, mas houve erro ao definir o acesso: '+pe.message)
  document.getElementById('finModalOverlay')?.remove();await czAlert('Login criado com sucesso.','Usuário criado');await renderUsuariosPermissoes();return false;
 });
 setTimeout(()=>{const form=document.getElementById('finModalForm');if(form){const btn=form.querySelector('button[type=submit]');if(btn)btn.textContent='Criar login'}},20);
}
async function editarPermissoesUsuario(id){
 const {data:u,error}=await db.from('usuarios_sistema').select('*').eq('id',id).single();if(error||!u)return czAlert(error?.message||'Usuário não encontrado.');
 const principal=String(u.email||'').toLowerCase()===CZ_MASTER_EMAIL;
 const ov=document.createElement('div');ov.id='permModal';ov.className='modal';
 ov.innerHTML=`<div class="modalbox" style="width:min(620px,100%)"><div class="sectionhead"><div><h2>Editar usuário</h2><div class="muted">${esc(u.email||'')}</div></div><button class="btn secondary" onclick="document.getElementById('permModal')?.remove()">Fechar</button></div><div class="field"><label>Nome</label><input id="permNome" value="${esc(u.nome||'')}"></div><div class="field"><label>Tipo de acesso</label><select id="permPerfil" ${principal?'disabled':''}><option value="master" ${czTipoAcesso(u)==='Master'?'selected':''}>Master</option><option value="frente" ${czTipoAcesso(u)!=='Master'?'selected':''}>Frente de separação</option></select></div><div class="field"><label class="client-switch"><input id="permAtivo" type="checkbox" ${u.ativo?'checked':''} ${principal?'disabled':''}> Usuário ativo</label></div><div class="actions"><button class="btn secondary" onclick="document.getElementById('permModal')?.remove()">Cancelar</button><button class="btn primary" onclick="salvarPermissoesUsuario('${u.id}')">Salvar</button></div></div>`;document.body.appendChild(ov);
}
async function salvarPermissoesUsuario(id){
 const {data:u,error}=await db.from('usuarios_sistema').select('*').eq('id',id).single();if(error||!u)return czAlert(error?.message||'Usuário não encontrado.');
 const principal=String(u.email||'').toLowerCase()===CZ_MASTER_EMAIL;const tipo=principal?'master':$('#permPerfil').value;const perfil=principal?'master_principal':tipo==='master'?'master_autorizado':'usuario';const ativo=principal?true:$('#permAtivo').checked;const permissoes=tipo==='master'?czPermTudo():czPermFrente();
 const {error:er}=await db.from('usuarios_sistema').update({nome:$('#permNome').value.trim(),perfil,ativo,permissoes,atualizado_em:new Date().toISOString()}).eq('id',id);if(er)return czAlert(er.message,'Erro ao salvar');document.getElementById('permModal')?.remove();await czAlert('Usuário atualizado com sucesso.','Usuário atualizado');renderUsuariosPermissoes();
}
async function excluirLoginSistema(id,email){
 if(!contaMaster())return czAlert('Somente Master pode excluir logins.','Acesso restrito');
 if(String(email||'').toLowerCase()===CZ_MASTER_EMAIL)return czAlert('O Master principal é protegido e não pode ser excluído.','Login protegido');
 if(!await czConfirm(`Excluir definitivamente o login ${email}?`,'Excluir login','Excluir'))return;
 try{const {data,error}=await db.functions.invoke('cz-excluir-usuario',{body:{id,email}});if(error)throw new Error(error.message||'Falha ao excluir login.');if(data?.error)throw new Error(data.error);await czAlert('Login excluído do sistema e do acesso.','Login excluído');renderUsuariosPermissoes()}catch(e){czAlert(e.message||String(e),'Erro ao excluir')}
}

boot();
