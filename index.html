db.auth.onAuthStateChange((event, session) => {

async function boot(){

  if (session) {

  } else {

function mostrarNovaSenha(){
  $('#app').classList.add('hidden');

async function salvarNovaSenha(){
  const senha = $('#novaSenha').value;
  const confirmar = $('#confirmarSenha').value;
  const msg = $('#novaSenhaMsg');

  if (!senha || !confirmar) {
    msg.textContent = 'Preencha os dois campos.';
    return;
  }

  if (senha.length < 6) {
    msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    return;
  }

  if (senha !== confirmar) {
    msg.textContent = 'As senhas não são iguais.';
    return;
  }

  msg.textContent = 'Salvando nova senha...';

  const {error} = await db.auth.updateUser({
    password: senha
  });

  if (error) {
    msg.textContent = 'Erro: ' + error.message;
    return;
  }

  await db.auth.signOut();

  alert('Senha alterada com sucesso! Entre com sua nova senha.');
  window.location.href = 'https://cz-efeitos-especiais.vercel.app';
}

$('#logoutBtn').onclick=async()=>{await db.auth.signOut();showLogin()};
  async function recuperarSenha(){
  const email = $('#email').value.trim();
  if(!email){
    $('#loginMsg').textContent='Digite seu e-mail primeiro.';

  const {error}=await db.auth.resetPasswordForEmail(email,{

  document.querySelectorAll('.orc-equipe-linha, .linhaEquipe').forEach(linha => {
    const diaria = Number(linha.querySelector('.equipeValorDiaria')?.value || 0);
    const dias = Number(linha.querySelector('.equipeDiarias')?.value || 0);
    const estadia = Number(linha.querySelector('.equipeEstadia')?.value || 0);
const alimentacao = Number(linha.querySelector('.equipeAlimentacao')?.value || 0);
   const total = (diaria * dias) + (alimentacao * dias) + (estadia * dias);
    totalEquipe += total;

    const campoTotal = linha.querySelector('.equipeTotal');
    if (campoTotal) {
      campoTotal.value = total.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });

  });
const campoTotalEquipe = document.querySelector('#orcTotalEquipe');
if (campoTotalEquipe) {

};

  function mostrarItens(tipo){

  async function prepararProdutos(){
    const destino=$('#orcProdutoPicker');
    const {data,error}=await db.from('produtos').select('*').order('nome');
    if(!destino || !destino.isConnected)return;
    if(error){destino.textContent='Erro ao carregar produtos: '+error.message;return}
    if(!data?.length){destino.innerHTML='<p>Nenhum produto cadastrado. Cadastre um produto no menu Estoque antes de adicioná-lo ao orçamento.</p>';return}
    destino.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:start">
      <div class="field"><label>Produto</label><select id="orcProdutoSelect"><option value="">Selecione o produto</option>${data.map((item,i)=>`<option value="${i}">${esc(item.nome)}</option>`).join('')}</select><button id="orcConfirmarProduto" type="button" class="btn primary" style="margin-top:10px">+ Adicionar Produto</button></div>
      <div class="field"><label>Quantidade</label><input id="orcProdutoQtd" type="number" min="1" step="1" value="1"></div>
      <div class="field"><label>Valor unitário</label><input id="orcProdutoUnitario" readonly></div>
      <div class="field"><label>Tabela de preço</label><select id="orcProdutoTabela"><option value="1">Tabela 1 (varejo)</option><option value="2">Tabela 2 (atacado)</option></select></div>
      <div class="field"><label>Valor total da linha</label><input id="orcProdutoTotal" readonly></div>
    </div><div id="orcProdutoMsg" class="msg" role="status"></div>`;
    const precoSelecionado=()=>{
      const item=data[Number($('#orcProdutoSelect').value)];
      if($('#orcProdutoSelect').value===''||!item)return null;
      const valor=$('#orcProdutoTabela').value==='1'?item.valor_varejo:item.valor_atacado;
      return valor===null||valor===undefined||valor===''?null:Number(valor);
    };
    const atualizarPreview=()=>{
      const preco=precoSelecionado(),quantidade=Number($('#orcProdutoQtd').value);
      $('#orcProdutoUnitario').value=preco===null||!Number.isFinite(preco)?'Preço não cadastrado':money(preco);
      $('#orcProdutoTotal').value=preco===null||!Number.isFinite(preco)||!Number.isInteger(quantidade)||quantidade<1?'—':money(preco*quantidade);
    };
    ['orcProdutoSelect','orcProdutoTabela','orcProdutoQtd'].forEach(id=>$('#'+id).addEventListener('input',atualizarPreview));
    $('#orcConfirmarProduto').onclick=()=>{
      const indice=$('#orcProdutoSelect').value,quantidade=Number($('#orcProdutoQtd').value),preco=precoSelecionado();
      if(indice===''){$('#orcProdutoMsg').textContent='Selecione um produto.';return}
      if(!Number.isInteger(quantidade)||quantidade<1){$('#orcProdutoMsg').textContent='Informe uma quantidade inteira maior que zero.';return}
      if(preco===null||!Number.isFinite(preco)||preco<0){$('#orcProdutoMsg').textContent='Cadastre o preço desta tabela no produto antes de adicioná-lo.';return}
      const item=data[Number(indice)];
      itensProduto.push({id:item.id,nome:item.nome,quantidade,preco,tabela:Number($('#orcProdutoTabela').value)});
      $('#orcProdutoMsg').textContent='Produto adicionado.';
      $('#orcProdutoSelect').value='';$('#orcProdutoQtd').value='1';atualizarPreview();
      mostrarItens('produto');atualizarEquipe();
    };
    atualizarPreview();
  }
  async function adicionarItem(tipo){

    if(error){destino.textContent='Erro ao carregar '+tabela+': '+error.message;return}
    if(!data?.length){destino.innerHTML=`<p>Nenhum ${tipo==='produto'?'produto':'equipamento'} cadastrado.</p><button type="button" class="btn secondary" id="irCadastro">Abrir cadastro</button>`;$('#irCadastro').onclick=()=>renderModule(tipo==='produto'?5:6);return}
    destino.innerHTML=`<div class="row"><div class="field"><label>${tipo==='produto'?'Produto':'Equipamento'}</label><select id="orcItemSelect">${data.map((item,i)=>`<option value="${i}">${esc(item.nome)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="orcItemQtd" type="number" min="1" step="1" value="1"></div><div class="field"><label>Tabela de preço</label><select id="orcItemTabela"><option value="1">Tabela 1</option><option value="2">Tabela 2</option></select></div></div><div class="actions"><button type="button" id="orcCancelarItem" class="btn secondary">Cancelar</button><button type="button" id="orcConfirmarItem" class="btn primary">Adicionar ao orçamento</button></div><div id="orcItemMsg" class="msg"></div>`;
    $('#orcCancelarItem').onclick=()=>mostrarItens(tipo);
    $('#orcConfirmarItem').onclick=()=>{
      const item=data[Number($('#orcItemSelect').value)];
      const quantidade=Number($('#orcItemQtd').value);
      if(!Number.isInteger(quantidade)||quantidade<1){$('#orcItemMsg').textContent='Informe uma quantidade inteira maior que zero.';return}
      const tab=Number($('#orcItemTabela').value);
      const preco=Number(tipo==='produto'?(tab===1?item.valor_varejo:item.valor_atacado):(tab===1?item.valor_locacao_tabela1:item.valor_locacao_tabela2));
      if(!Number.isFinite(preco)||preco<0){$('#orcItemMsg').textContent='Cadastre o valor desta tabela antes de adicionar.';return}
      (tipo==='produto'?itensProduto:itensAtivo).push({id:item.id,nome:item.nome,quantidade,preco,tabela:tab});

  function dadosProposta(){
    const equipe=[...document.querySelectorAll('.orc-equipe-linha, .linhaEquipe')].map(l=>({
      nome:l.querySelector('.equipeNome')?.value?.trim()||'',
      diarias:Number(l.querySelector('.equipeDiarias')?.value||0),
      valor_diaria:Number(l.querySelector('.equipeValorDiaria')?.value||0),
      alimentacao:Number(l.querySelector('.equipeAlimentacao')?.value||0),
      estadia:Number(l.querySelector('.equipeEstadia')?.value||0)
    })).filter(x=>x.nome||x.diarias||x.valor_diaria||x.alimentacao||x.estadia);
    const totalEquipe=equipe.reduce((s,x)=>s+(x.valor_diaria*x.diarias)+(x.alimentacao*x.diarias)+(x.estadia*x.diarias),0);
    const deslocamento=(Number($('#orcKm').value||0)*Number($('#orcValorKm').value||0))+Number($('#orcPedagio').value||0);
    const totalItens=[...itensProduto,...itensAtivo].reduce((s,x)=>s+(x.quantidade*x.preco),0);
    return {
      cliente:$('#orcCliente').value.trim(), telefone:$('#orcTelefone').value.trim(),
      evento:$('#orcEvento').value.trim(), data_evento:$('#orcData').value||null,
      local_evento:$('#orcLocalEvento').value.trim(), horario:$('#orcHorario').value||null,
      horario_montagem:$('#orcHorarioMontagem').value||null,
      responsavel_evento:$('#orcResponsavelEvento').value.trim(), telefone_responsavel:$('#orcTelefoneResponsavel').value.trim(),
      tecnico_responsavel:$('#orcTecnicoResponsavel').value.trim(),
      produtos:itensProduto.map(x=>({...x})), equipamentos:itensAtivo.map(x=>({...x})), equipe,
      deslocamento:{veiculo:$('#orcVeiculo')?.value?.trim()||'',km:Number($('#orcKm').value||0),valor_km:Number($('#orcValorKm').value||0),pedagio:Number($('#orcPedagio').value||0)},
      total:Number((totalEquipe+deslocamento+totalItens).toFixed(2))
    };
  }
  function validarProposta(d){
    if(!d.cliente)return 'Informe o nome do cliente.';
    if(!d.evento)return 'Informe o nome do projeto/evento.';
    if(!d.data_evento)return 'Informe a data do evento.';
    if(!d.produtos.length&&!d.equipamentos.length)return 'Adicione pelo menos um produto ou equipamento.';
    return '';
  }
  function gerarPdfProposta(d,numero){
    if(!window.jspdf?.jsPDF)throw new Error('Não foi possível carregar o gerador de PDF.');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=210; let y=0;
    const novaPagina=()=>{pdf.addPage();cabecalho(false);y=34};
    const cabecalho=(capa=true)=>{
      pdf.setFillColor(18,22,28);pdf.rect(0,0,W,capa?42:25,'F');
      pdf.setTextColor(212,170,76);pdf.setFont('helvetica','bold');pdf.setFontSize(capa?20:14);pdf.text('CZ EFEITOS ESPECIAIS',15,capa?18:15);
      pdf.setTextColor(255,255,255);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.text('PROPOSTA COMERCIAL',15,capa?27:20);
      pdf.setTextColor(80,80,80);
    };
    cabecalho(true); y=52;
    pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.setTextColor(25,25,25);pdf.text('Proposta '+numero,15,y); y+=9;
    pdf.setFont('helvetica','normal');pdf.setFontSize(10);
    const dataFmt=d.data_evento?new Date(d.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):'—';
    const infos=[['Cliente',d.cliente],['Projeto / Evento',d.evento],['Data do evento',dataFmt],['Local',d.local_evento||'—'],['Horário',d.horario||'—']];
    infos.forEach(([a,b])=>{pdf.setFont('helvetica','bold');pdf.text(a+':',15,y);pdf.setFont('helvetica','normal');pdf.text(String(b),48,y);y+=7});
    y+=4;pdf.setDrawColor(212,170,76);pdf.line(15,y,195,y);y+=10;
    pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.text('Serviços, produtos e equipamentos',15,y);y+=8;
    const linhas=[...d.produtos.map(x=>({nome:x.nome,qtd:x.quantidade,tipo:'Produto / serviço'})),...d.equipamentos.map(x=>({nome:x.nome,qtd:x.quantidade,tipo:'Equipamento'}))];
    pdf.setFontSize(9);pdf.setFillColor(242,242,242);pdf.rect(15,y-5,180,8,'F');pdf.text('Descrição',18,y);pdf.text('Tipo',135,y);pdf.text('Qtd.',185,y,{align:'right'});y+=8;
    pdf.setFont('helvetica','normal');
    linhas.forEach(x=>{if(y>265){novaPagina()} const nome=pdf.splitTextToSize(String(x.nome),108);pdf.text(nome,18,y);pdf.text(x.tipo,135,y);pdf.text(String(x.qtd),185,y,{align:'right'});y+=Math.max(7,nome.length*5);pdf.setDrawColor(230);pdf.line(15,y-3,195,y-3)});
    if(y>245){novaPagina()}
    y+=8;pdf.setFillColor(18,22,28);pdf.roundedRect(15,y,180,28,3,3,'F');
    pdf.setTextColor(255,255,255);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text('INVESTIMENTO TOTAL',22,y+9);
    pdf.setTextColor(212,170,76);pdf.setFont('helvetica','bold');pdf.setFontSize(19);pdf.text(money(d.total),22,y+21);
    y+=39;pdf.setTextColor(75,75,75);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
    pdf.text('CZ Efeitos Especiais • Proposta gerada em '+new Date().toLocaleString('pt-BR'),15,y);
    pdf.save('proposta-'+numero.replace(/[^a-zA-Z0-9_-]/g,'-')+'-'+d.cliente.replace(/[^a-zA-Z0-9_-]/g,'-')+'.pdf');
  }
  async function salvarProposta(status='enviado'){
    const d=dadosProposta(),erro=validarProposta(d);if(erro)throw new Error(erro);
    const numero='CZ-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6);
    const payload={numero,status,cliente_nome:d.cliente,cliente_telefone:d.telefone||null,evento_nome:d.evento,data_evento:d.data_evento,local_evento:d.local_evento||null,valor_total:d.total,dados:d,criado_em:new Date().toISOString()};
    const {data,error}=await db.from('orcamentos').insert(payload).select('*').single();
    if(error)throw error;
    return {registro:data,d,numero};
  }
  async function carregarPropostasSalvas(){
    const box=$('#orcPropostasSalvas');if(!box)return;
    const {data,error}=await db.from('orcamentos').select('id,numero,status,cliente_nome,evento_nome,data_evento,valor_total,criado_em').order('criado_em',{ascending:false}).limit(30);
    if(error){box.innerHTML='<div class="muted">Execute o SQL de Orçamentos para ativar o histórico de propostas.</div>';return}
    box.innerHTML=data?.length?`<div class="tablewrap"><table><thead><tr><th>Proposta</th><th>Cliente</th><th>Evento</th><th>Data</th><th>Total</th><th>Status</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.numero)}</td><td>${esc(x.cliente_nome)}</td><td>${esc(x.evento_nome||'')}</td><td>${x.data_evento?new Date(x.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${money(x.valor_total)}</td><td>${esc(x.status||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nenhuma proposta gerada ainda.</div>';
  }
  const topo=document.createElement('div');topo.className='card';topo.style.marginBottom='18px';topo.innerHTML='<div class="sectionhead"><div><h3 style="margin:0">Propostas salvas</h3><div class="muted">Histórico das propostas geradas</div></div></div><div id="orcPropostasSalvas"><div class="muted">Carregando...</div></div>';
  $('#content').insertBefore(topo,$('#content').firstChild);carregarPropostasSalvas();
  prepararProdutos();
  $('#orcAddAsset').onclick=()=>adicionarItem('ativo');
  $('#orcSave').onclick=()=>{$('#orcMsg').textContent='Rascunho não é gerado como proposta. Use GERAR PROPOSTA quando estiver pronto.'};
  $('#orcPrint').onclick=async()=>{
    const btn=$('#orcPrint');btn.disabled=true;$('#orcMsg').textContent='Salvando proposta e preparando PDF...';
    try{const r=await salvarProposta('enviado');gerarPdfProposta(r.d,r.numero);$('#orcMsg').textContent='Proposta '+r.numero+' salva em Orçamentos e PDF gerado.';await carregarPropostasSalvas()}
    catch(e){$('#orcMsg').textContent='Erro ao gerar proposta: '+e.message}
    finally{btn.disabled=false}

  function calcularPrecosProduto(){
  const custo = Number($('#productCost')?.value || 0);
  const varejoPercent = Number($('#productRetailPercent')?.value || 0);
  const atacadoPercent = Number($('#productWholesalePercent')?.value || 0);

  const varejoLucro = custo * (varejoPercent / 100);
  const atacadoLucro = custo * (atacadoPercent / 100);

  if($('#productRetail')) $('#productRetail').value = (custo + varejoLucro).toFixed(2);
  if($('#productRetailProfit')) $('#productRetailProfit').value = varejoLucro.toFixed(2);

  if($('#productWholesale')) $('#productWholesale').value = (custo + atacadoLucro).toFixed(2);
  if($('#productWholesaleProfit')) $('#productWholesaleProfit').value = atacadoLucro.toFixed(2);
}

['productCost','productRetailPercent','productWholesalePercent'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', calcularPrecosProduto);
});
function atualizarLucroPeloValor(tipo){
  const custo=Number($('#productCost').value||0);
  const campoValor=tipo==='varejo'?'#productRetail':'#productWholesale';
  const campoPercent=tipo==='varejo'?'#productRetailPercent':'#productWholesalePercent';
  const campoLucro=tipo==='varejo'?'#productRetailProfit':'#productWholesaleProfit';
  const lucro=Number($(campoValor).value||0)-custo;
  $(campoLucro).value=lucro.toFixed(2);
  $(campoPercent).value=custo>0?((lucro/custo)*100).toFixed(2):'0';
}

async function renderShoppingList(){
  const [compras,cadastro]=await Promise.all([
    db.from('lista_compras').select('*').order('criado_em',{ascending:false}),
    db.from('produtos').select('id,nome,marca,fornecedor,valor_custo,estoque_atual,estoque_minimo,codigo_barras')

  const porId=new Map((cadastro.data||[]).map(p=>[String(p.id),p]));

  $('#content').innerHTML=`<div class="sectionhead"><div><h2>Lista de compra</h2><div class="muted">${linhas.length} produto(s)</div></div><div class="actions"><button id="purchasePdf" type="button" class="btn primary" ${linhas.length?'':'disabled'}>Gerar PDF</button><button class="btn secondary" onclick="renderModule(5)">Ver Estoque</button></div></div><div id="purchaseMsg" class="msg" role="status"></div><div class="tablewrap">${linhas.length?`<table><thead><tr><th>Produto</th><th>Marca</th><th>Fornecedor</th><th>Qtd. para comprar</th><th>Última compra (un.)</th><th>Total último custo</th><th>Novo valor (un.)</th><th>Total compra atual</th><th>Ações</th></tr></thead><tbody>${linhas.map((item,i)=>{const p=item.produto;return `<tr data-purchase-row="${i}"><td>${esc(p?.nome||'Produto removido do cadastro')}</td><td>${esc(p?.marca||'—')}</td><td>${esc(p?.fornecedor||'—')}</td><td><input class="purchase-input" data-purchase-qty="${i}" type="number" min="0.01" step="0.01" value="${Number(item.quantidade??1)}" aria-label="Quantidade para comprar de ${esc(p?.nome||'produto')}"></td><td>${money(p?.valor_custo)}</td><td data-last-total="${i}"></td><td><input class="purchase-input" data-purchase-current="${i}" type="number" min="0" step="0.01" value="${item.valor_compra_atual??''}" placeholder="Preencher" aria-label="Novo valor unitário de ${esc(p?.nome||'produto')}"></td><td data-current-total="${i}"></td><td><button type="button" class="btn danger" data-remove-purchase="${esc(item.produto_id)}">Remover</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">A lista está vazia. Adicione produtos pelo Estoque.</div>'}</div><div class="card" style="margin-top:16px"><div>Total pelo último custo: <strong id="purchaseGrandLast">R$ 0,00</strong></div><div style="margin-top:8px">Total da compra atual: <strong id="purchaseGrandCurrent">R$ 0,00</strong> <span id="purchasePending" class="muted"></span></div></div>`;
  const pendentes=new Set();
  const atualizarTotais=()=>{
    let ultimo=0,atual=0,faltando=0;
    linhas.forEach((item,i)=>{
      const q=Number($(`[data-purchase-qty="${i}"]`).value);
      const raw=$(`[data-purchase-current="${i}"]`).value;
      const novo=raw===''?null:Number(raw);
      const anterior=Number(item.produto?.valor_custo||0);
      const quantidade=Number.isFinite(q)&&q>0?q:0;
      ultimo+=quantidade*anterior;

  $('#content').onchange=e=>{

      input.disabled=false;

    })();
    pendentes.add(salvar);salvar.finally(()=>pendentes.delete(salvar));
  };

function gerarPdfCompras(linhas){
  if(!window.jspdf?.jsPDF){$('#purchaseMsg').textContent='Não foi possível carregar o gerador de PDF. Atualize a página e tente novamente.';return}
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const xs=[12,62,90,132,149,183,217,253],larguras=[48,26,40,15,32,32,34,32];
  const cabecalhos=['Produto','Marca','Fornecedor','Qtd.','Último un.','Novo un.','Total último','Total atual'];
  let y=0;
  function cabecalho(){
    pdf.setFillColor(22,31,42);pdf.rect(0,0,297,30,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(16);pdf.text('CZ Efeitos Especiais | Lista de compra',12,15);
    pdf.setFontSize(9);pdf.text(new Date().toLocaleString('pt-BR'),285,15,{align:'right'});
    pdf.setTextColor(30,35,40);pdf.setFontSize(8);pdf.setFont('helvetica','bold');
    cabecalhos.forEach((h,i)=>pdf.text(h,xs[i],36));pdf.setDrawColor(180);pdf.line(12,39,285,39);pdf.setFont('helvetica','normal');y=42;
  }
  cabecalho();let totalAnterior=0,totalAtual=0,faltando=0;
  linhas.forEach(item=>{
    if(y>181){pdf.addPage();cabecalho()}
    const quantidade=Number(item.quantidade||1),anterior=Number(item.produto?.valor_custo||0);
    const novo=item.valor_compra_atual===null||item.valor_compra_atual===undefined?null:Number(item.valor_compra_atual);
    totalAnterior+=quantidade*anterior;if(novo===null)faltando++;else totalAtual+=quantidade*novo;
    const p=item.produto||{};
    const valores=[p.nome||'Produto removido',p.marca||'—',p.fornecedor||'—',String(quantidade),money(anterior),novo===null?'Pendente':money(novo),money(quantidade*anterior),novo===null?'Pendente':money(quantidade*novo)];
    pdf.setFontSize(8);
    valores.forEach((v,i)=>{const texto=pdf.splitTextToSize(String(v),larguras[i]).slice(0,2);pdf.text(texto,xs[i],y+4)});
    pdf.setDrawColor(225);pdf.line(12,y+11,285,y+11);y+=13;
  });
  if(y>177){pdf.addPage();cabecalho()}
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);
  pdf.text('Total pelo último custo: '+money(totalAnterior),12,y+9);
  pdf.text('Total da compra atual: '+money(totalAtual)+(faltando?` (${faltando} preço(s) pendente(s))`:''),12,y+16);
  pdf.save('lista-de-compra-cz-'+new Date().toISOString().slice(0,10)+'.pdf');
}

async function renderAssets(){const {data,error}=await db.from('ativos').select('*').order('nome');if(error){$('#content').innerHTML=`<div class="msg">Erro ao carregar ativos: ${error.message}</div>`;return}assets=data||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Ativos / Equipamentos</h2><div class="muted">${assets.length} ativo(s)</div></div><button class="btn primary" onclick="openAsset()">+ Novo ativo</button></div><div class="tablewrap">${assets.length?`<table><thead><tr><th>Foto</th><th>Equipamento</th><th>Código</th><th>Cód. barras</th><th>Compra</th><th>Valor compra</th><th>Status</th><th>Ações</th></tr></thead><tbody>${assets.map(a=>`<tr><td>${a.foto_url?`<img class="thumb" src="${esc(a.foto_url)}">`:'—'}</td><td>${esc(a.nome)}</td><td>${esc(a.codigo_interno||'')}</td><td>${esc(a.codigo_barras||'')}</td><td>${a.data_compra?new Date(a.data_compra+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${money(a.valor_compra)}</td><td>${esc(a.status||'')}</td><td><button class="btn secondary" onclick="editAsset('${a.id}')">Editar</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Nenhum ativo cadastrado.</div>`}</div>`}
function openAsset(a=null){$('#assetModal').classList.remove('hidden');$('#assetModalTitle').textContent=a?'Editar ativo':'Novo ativo';$('#assetId').value=a?.id||'';$('#assetName').value=a?.nome||'';$('#assetCode').value=a?.codigo_interno||'';$('#assetBarcode').value=a?.codigo_barras||'';$('#assetSupplier').value=a?.fornecedor||'';$('#assetPurchaseDate').value=a?.data_compra||'';$('#assetPurchaseValue').value=a?.valor_compra??0;$('#assetRent1').value=a?.valor_locacao_tabela1??0;$('#assetRent2').value=a?.valor_locacao_tabela2??0;$('#assetWeight').value=a?.peso??'';$('#assetCase').value=String(a?.possui_case??false);$('#assetNotes').value=a?.observacoes||'';$('#assetPhoto').value='';const im=$('#assetPreview');if(a?.foto_url){im.src=a.foto_url;im.classList.remove('hidden')}else im.classList.add('hidden');$('#assetMsg').textContent=''}
function closeAsset(){$('#assetModal').classList.add('hidden')}
function editAsset(id){openAsset(assets.find(a=>a.id===id))}
$('#assetPhoto').onchange=e=>{const f=e.target.files[0];if(f){$('#assetPreview').src=URL.createObjectURL(f);$('#assetPreview').classList.remove('hidden')}};
$('#saveAssetBtn').onclick=async()=>{const id=$('#assetId').value;$('#assetMsg').textContent='Salvando...';try{let foto_url=id?assets.find(a=>a.id===id)?.foto_url:null;const f=$('#assetPhoto').files[0];if(f)foto_url=await uploadPhoto(f,'ativos');const payload={nome:$('#assetName').value.trim(),codigo_interno:$('#assetCode').value.trim()||null,codigo_barras:$('#assetBarcode').value.trim()||null,fornecedor:$('#assetSupplier').value.trim()||null,data_compra:$('#assetPurchaseDate').value||null,valor_compra:+$('#assetPurchaseValue').value||0,valor_locacao_tabela1:+$('#assetRent1').value||0,valor_locacao_tabela2:+$('#assetRent2').value||0,peso:$('#assetWeight').value?+$('#assetWeight').value:null,possui_case:$('#assetCase').value==='true',observacoes:$('#assetNotes').value.trim()||null,foto_url,atualizado_em:new Date().toISOString()};if(!payload.nome)throw new Error('Informe o nome do equipamento.');const {error}=await(id?db.from('ativos').update(payload).eq('id',id):db.from('ativos').insert(payload));if(error)throw error;closeAsset();renderAssets()}catch(e){$('#assetMsg').textContent='Erro: '+e.message}};


// ===== MÓDULO EVENTOS / OPERAÇÃO =====
async function renderEventos(){
  const {data,error}=await db.from('eventos_operacionais').select('*').order('data_evento',{ascending:true});
  if(error){$('#content').innerHTML=`<div class="sectionhead"><h2>Eventos</h2></div><div class="msg">Para ativar Eventos, execute primeiro o SQL desta versão no Supabase.<br>${esc(error.message)}</div>`;return}
  const eventos=data||[];
  $('#content').innerHTML=`
    <div class="sectionhead"><div><h2>📅 Eventos</h2><div class="muted">Agenda operacional — sem valores financeiros</div></div><button class="btn primary" id="novoEventoBtn">+ Novo evento</button></div>
    <div class="cards" style="margin-bottom:16px">
      <div class="card"><div class="muted">Próximos eventos</div><div class="n">${eventos.filter(e=>e.status!=='finalizado').length}</div></div>
      <div class="card"><div class="muted">Em separação</div><div class="n">${eventos.filter(e=>['aguardando_separacao','separando'].includes(e.status)).length}</div></div>
      <div class="card"><div class="muted">Material pronto</div><div class="n">${eventos.filter(e=>e.status==='material_pronto').length}</div></div>
      <div class="card"><div class="muted">Aguardando retorno</div><div class="n">${eventos.filter(e=>e.status==='aguardando_retorno').length}</div></div>
    </div>
    <div class="tablewrap">${eventos.length?`<table><thead><tr><th>Data</th><th>Cliente</th><th>Evento</th><th>Local</th><th>Status</th><th>Operação</th></tr></thead><tbody>${eventos.map(e=>`<tr><td>${e.data_evento?new Date(e.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${esc(e.cliente_nome||'')}</td><td>${esc(e.nome_evento||'')}</td><td>${esc(e.local_evento||'')}</td><td>${statusEventoLabel(e.status)}</td><td><button class="btn primary" onclick="abrirEvento('${e.id}')">Abrir evento</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum evento liberado ainda.</div>'}</div>`;
  $('#novoEventoBtn').onclick=()=>novoEventoManual();
}
function statusEventoLabel(s){return ({aguardando_separacao:'⏳ Aguardando separação',separando:'📦 Separando',material_pronto:'✅ Material pronto',liberado:'🚚 Liberado',em_execucao:'🎆 Em execução',aguardando_retorno:'↩️ Aguardando retorno',finalizado:'🏁 Finalizado'})[s]||esc(s||'Aguardando separação')}
async function novoEventoManual(){
  const {data:cs}=await db.from('clientes').select('id,nome,telefone').order('nome');
  $('#content').innerHTML=`<div class="sectionhead"><div><h2>Novo evento</h2><div class="muted">Cadastro operacional. Os valores não aparecem neste módulo.</div></div><button class="btn secondary" onclick="renderEventos()">Voltar</button></div>
  <div class="card"><div class="row"><div class="field"><label>Cliente *</label><select id="evCliente"><option value="">Selecione</option>${(cs||[]).map(c=>`<option value="${esc(c.id)}" data-nome="${esc(c.nome)}" data-tel="${esc(c.telefone||'')}">${esc(c.nome)}</option>`).join('')}</select></div><div class="field"><label>Evento *</label><input id="evNome"></div></div><div class="row"><div class="field"><label>Data *</label><input id="evData" type="date"></div><div class="field"><label>Local</label><input id="evLocal"></div></div><div class="row"><div class="field"><label>Horário</label><input id="evHora" type="time"></div><div class="field"><label>Horário de montagem</label><input id="evMontagem" type="time"></div></div><div class="field"><label>Técnico responsável</label><input id="evTecnico"></div><div class="actions"><button class="btn primary" id="salvarEvento">Criar evento</button></div><div id="evMsg" class="msg"></div></div>`;
  $('#salvarEvento').onclick=async()=>{const sel=$('#evCliente'),opt=sel.options[sel.selectedIndex];if(!sel.value||!$('#evNome').value.trim()||!$('#evData').value){$('#evMsg').textContent='Informe cliente, evento e data.';return}const payload={cliente_id:sel.value,cliente_nome:opt.dataset.nome,cliente_telefone:opt.dataset.tel||null,nome_evento:$('#evNome').value.trim(),data_evento:$('#evData').value,local_evento:$('#evLocal').value.trim()||null,horario_evento:$('#evHora').value||null,horario_montagem:$('#evMontagem').value||null,tecnico_responsavel:$('#evTecnico').value.trim()||null,status:'aguardando_separacao'};const {data,error}=await db.from('eventos_operacionais').insert(payload).select().single();if(error){$('#evMsg').textContent='Erro: '+error.message;return}abrirEvento(data.id)};
}
async function abrirEvento(id){
 const [evr,matr]=await Promise.all([db.from('eventos_operacionais').select('*').eq('id',id).single(),db.from('evento_materiais').select('*').eq('evento_id',id).order('criado_em')]);
 if(evr.error){alert(evr.error.message);return} const e=evr.data,mats=matr.data||[];
 const total=mats.reduce((s,m)=>s+Number(m.quantidade_necessaria||0),0),bip=mats.reduce((s,m)=>s+Number(m.quantidade_bipada||0),0),completo=total>0&&bip>=total;
 $('#content').innerHTML=`<div class="sectionhead"><div><h2>🎪 ${esc(e.nome_evento)}</h2><div class="muted">${esc(e.cliente_nome)} • ${e.data_evento?new Date(e.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):''} • ${esc(e.local_evento||'')}</div></div><button class="btn secondary" onclick="renderEventos()">Voltar à agenda</button></div>
 <div class="card" style="margin-bottom:16px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><div><span class="muted">Status</span><div><b>${statusEventoLabel(e.status)}</b></div></div><div><span class="muted">Técnico</span><div>${esc(e.tecnico_responsavel||'—')}</div></div><div><span class="muted">Horário</span><div>${esc(e.horario_evento||'—')}</div></div><div><span class="muted">Montagem</span><div>${esc(e.horario_montagem||'—')}</div></div></div></div>
 <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">📦 Separação e bipagem</h3><div class="muted" style="margin-bottom:10px">Bipe ou digite o código de barras. Esta tela não mostra valores.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="scanEvento" placeholder="Bipe o código de barras" autocomplete="off" style="flex:1;min-width:220px;background:#0b1118;color:#fff;border:1px solid var(--line);border-radius:9px;padding:12px"><button class="btn primary" id="btnBipar">BIPAR</button><button class="btn secondary" id="btnAddMat">+ Material</button></div><div id="scanMsg" class="msg"></div></div>
 <div class="tablewrap">${mats.length?`<table><thead><tr><th>Tipo</th><th>Produto / Equipamento</th><th>Código</th><th>Qtd.</th><th>Bipado</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${mats.map(m=>`<tr><td>${m.tipo==='ativo'?'Equipamento':'Produto'}</td><td>${esc(m.nome_item)}</td><td>${esc(m.codigo||'—')}</td><td>${m.quantidade_necessaria}</td><td><b>${m.quantidade_bipada}/${m.quantidade_necessaria}</b></td><td>${Number(m.quantidade_bipada)>=Number(m.quantidade_necessaria)?'✅ Conferido':'⏳ Separando'}</td><td><button class="btn danger" onclick="removerMaterialEvento('${m.id}','${id}')">Remover</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum material adicionado ao evento.</div>'}</div>
 <div class="card" style="margin-top:16px"><div><b>Progresso:</b> ${bip}/${total} unidade(s) conferida(s)</div><div class="actions"><button class="btn secondary" onclick="mudarStatusEvento('${id}','separando')">Iniciar separação</button><button class="btn primary" ${completo?'':'disabled'} onclick="mudarStatusEvento('${id}','material_pronto')">MATERIAL CONFERIDO</button><button class="btn primary" ${e.status==='material_pronto'?'':'disabled'} onclick="mudarStatusEvento('${id}','liberado')">CHECK-OUT / LIBERAR SAÍDA</button><button class="btn secondary" ${['liberado','em_execucao'].includes(e.status)?'':'disabled'} onclick="mudarStatusEvento('${id}','aguardando_retorno')">AGUARDAR RETORNO</button><button class="btn secondary" ${e.status==='aguardando_retorno'?'':'disabled'} onclick="mudarStatusEvento('${id}','finalizado')">FINALIZAR</button></div></div>`;
 $('#btnBipar').onclick=()=>biparEvento(id);$('#scanEvento').addEventListener('keydown',x=>{if(x.key==='Enter')biparEvento(id)});$('#btnAddMat').onclick=()=>adicionarMaterialEvento(id);
}
async function adicionarMaterialEvento(eventoId){
 const [pr,ar]=await Promise.all([db.from('produtos').select('id,nome,codigo_barras').order('nome'),db.from('ativos').select('id,nome,codigo_barras,codigo_interno,status').order('nome')]);
 const op=[...(pr.data||[]).map(x=>({tipo:'produto',...x,codigo:x.codigo_barras||''})),...(ar.data||[]).map(x=>({tipo:'ativo',...x,codigo:x.codigo_barras||x.codigo_interno||''}))];
 const escolha=prompt('Digite parte do nome ou código do material:');if(!escolha)return;const q=textoFiltro(escolha);const achados=op.filter(x=>textoFiltro(x.nome).includes(q)||textoFiltro(x.codigo).includes(q));if(!achados.length){alert('Material não encontrado.');return}let item=achados[0];if(achados.length>1){const lista=achados.slice(0,10).map((x,i)=>`${i+1} - ${x.nome} (${x.codigo||'sem código'})`).join('\n');const n=Number(prompt('Escolha o número:\n'+lista));if(!n||!achados[n-1])return;item=achados[n-1]}
 const qtd=Number(prompt('Quantidade necessária:',1));if(!Number.isFinite(qtd)||qtd<=0)return;
 const {error}=await db.from('evento_materiais').insert({evento_id:eventoId,tipo:item.tipo,item_id:item.id,nome_item:item.nome,codigo:item.codigo||null,quantidade_necessaria:qtd,quantidade_bipada:0});if(error){alert('Erro: '+error.message);return}abrirEvento(eventoId);
}
async function biparEvento(eventoId){const campo=$('#scanEvento'),codigo=campo.value.trim();if(!codigo){$('#scanMsg').textContent='Bipe ou digite um código.';return}const {data,error}=await db.from('evento_materiais').select('*').eq('evento_id',eventoId).eq('codigo',codigo);if(error){$('#scanMsg').textContent=error.message;return}const item=data?.[0];if(!item){$('#scanMsg').textContent='Código não pertence aos materiais deste evento.';return}if(Number(item.quantidade_bipada)>=Number(item.quantidade_necessaria)){ $('#scanMsg').textContent='Quantidade deste item já está completa.';return}const novo=Number(item.quantidade_bipada)+1;const {error:up}=await db.from('evento_materiais').update({quantidade_bipada:novo}).eq('id',item.id);if(up){$('#scanMsg').textContent=up.message;return}campo.value='';abrirEvento(eventoId)}
async function removerMaterialEvento(id,eventoId){if(!confirm('Remover este material do evento?'))return;const {error}=await db.from('evento_materiais').delete().eq('id',id);if(error){alert(error.message);return}abrirEvento(eventoId)}
async function mudarStatusEvento(id,status){const {error}=await db.from('eventos_operacionais').update({status,atualizado_em:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}abrirEvento(id)}

boot();
</script></body></html>
