<script>

// Janelas próprias CZ: substituem alert/confirm/prompt do navegador.
function czDialog({titulo='CZ Efeitos Especiais',mensagem='',tipo='alerta',valor='',placeholder='',confirmar='OK',cancelar='Cancelar'}={}){
 return new Promise(resolve=>{
  document.getElementById('czDialogOverlay')?.remove();
  const ov=document.createElement('div');ov.id='czDialogOverlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200000;display:flex;align-items:center;justify-content:center;padding:18px';
  const box=document.createElement('div');box.style.cssText='width:min(520px,100%);background:#151b26;border:1px solid #30394a;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:22px;color:#fff';
  const campo=tipo==='prompt'?`<input id="czDialogInput" value="${esc(String(valor??''))}" placeholder="${esc(placeholder||'')}" style="width:100%;margin-top:14px;box-sizing:border-box;background:#0f141d;color:#fff;border:1px solid #384254;border-radius:10px;padding:12px;font-size:14px;outline:none">`:'';
  box.innerHTML=`<div style="font-size:12px;color:#ff641f;font-weight:900;letter-spacing:.8px">CZ EFEITOS ESPECIAIS</div><h3 style="margin:5px 0 12px;font-size:21px">${esc(titulo)}</h3><div style="white-space:pre-wrap;line-height:1.5;color:#dce2eb">${esc(String(mensagem||''))}</div>${campo}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">${tipo!=='alerta'?`<button id="czDialogCancelar" class="btn secondary" type="button">${esc(cancelar)}</button>`:''}<button id="czDialogOk" class="btn primary" type="button">${esc(confirmar)}</button></div>`;
  ov.appendChild(box);document.body.appendChild(ov);
  const fechar=v=>{ov.remove();resolve(v)};box.querySelector('#czDialogOk').onclick=()=>fechar(tipo==='prompt'?(box.querySelector('#czDialogInput')?.value??''):true);box.querySelector('#czDialogCancelar')?.addEventListener('click',()=>fechar(tipo==='prompt'?null:false));
  ov.onclick=e=>{if(e.target===ov&&tipo!=='alerta')fechar(tipo==='prompt'?null:false)};
  const inp=box.querySelector('#czDialogInput');if(inp){setTimeout(()=>{inp.focus();inp.select()},30);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();box.querySelector('#czDialogOk').click()}if(e.key==='Escape')box.querySelector('#czDialogCancelar')?.click()}}
  else setTimeout(()=>box.querySelector('#czDialogOk')?.focus(),30);
 });
}
function czAlert(mensagem,titulo='Aviso'){return czDialog({titulo,mensagem,tipo:'alerta',confirmar:'OK'})}
function czConfirm(mensagem,titulo='Confirmação',confirmar='Confirmar'){return czDialog({titulo,mensagem,tipo:'confirmar',confirmar,cancelar:'Cancelar'})}
function czPrompt(mensagem,valor='',titulo='Preenchimento'){return czDialog({titulo,mensagem,tipo:'prompt',valor,confirmar:'Continuar',cancelar:'Cancelar'})}
window.alert=(m)=>{czAlert(m)};

let modoRecuperacao = false;

async function boot(){

function mostrarNovaSenha(){
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');

  $('.loginbox').innerHTML = `
    <div class="brand">CZ<small>EFEITOS ESPECIAIS</small></div>

    <div class="field">

      <input id="novaSenha" type="password">
    </div>

    <div class="field">
      <label>Confirmar nova senha</label>
      <input id="confirmarSenha" type="password">
    </div>

    <button type="button" class="btn primary full"
      style="margin-top:18px"
      onclick="salvarNovaSenha()">
      SALVAR NOVA SENHA
    </button>

    <div id="novaSenhaMsg" class="msg"></div>
  `;
}

async function salvarNovaSenha(){
  const senha = $('#novaSenha').value;
  const confirmar = $('#confirmarSenha').value;
  const msg = $('#novaSenhaMsg');

  if (!senha || !confirmar) {
    msg.textContent = 'Preencha os dois campos.';
    return;
  }

  if (senha.length < 6) {
    msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    return;
  }

  if (senha !== confirmar) {
    msg.textContent = 'As senhas não são iguais.';
    return;
  }

  msg.textContent = 'Salvando nova senha...';

  const {error} = await db.auth.updateUser({
    password: senha
  });

  if (error) {
    msg.textContent = 'Erro: ' + error.message;
    return;
  }

  await db.auth.signOut();

  alert('Senha alterada com sucesso! Entre com sua nova senha.');
  window.location.href = 'https://cz-efeitos-especiais.vercel.app';
}

 return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:12px"><b>${esc(rotulo)}</b><span>${esc(sub||String(valor))}</span></div><div style="height:12px;background:rgba(120,120,120,.18);border-radius:8px;overflow:hidden;margin-top:5px"><div style="height:100%;width:${pct}%;background:currentColor;border-radius:8px"></div></div></div>`;
}

 const prod=[...produtos.values()].sort((a,b)=>b.q-a.q),atv=[...ativos.values()].sort((a,b)=>b.q-a.q),topP=prod.slice(0,10),lowP=[...prod].sort((a,b)=>a.q-b.q).slice(0,10),topA=atv.slice(0,10),lowA=[...atv].sort((a,b)=>a.q-b.q).slice(0,10);

function idadeColaborador(data){
  if(!data)return null;
  const [ano,mes,dia]=data.split('-').map(Number),hoje=new Date();
  if(!ano||!mes||!dia)return null;
  let idade=hoje.getFullYear()-ano;
  if(hoje.getMonth()+1<mes||(hoje.getMonth()+1===mes&&hoje.getDate()<dia))idade--;
  return idade>=0&&idade<=120?idade:null;
}

  window.location.assign(data.signedUrl);
}

      const {data,error}=await db.from('colaboradores').delete().eq('id',id).select('id');

      form.classList.add('hidden');limpar();await carregar();
      const {data:arquivos,error:listarErro}=await db.storage.from('documentos-colaboradores').list(id,{limit:1000});
      if(listarErro)throw new Error('Cadastro excluído, mas não foi possível consultar os PDFs: '+listarErro.message);
      const caminhos=(arquivos||[]).filter(a=>a.name).map(a=>`${id}/${a.name}`);
      if(caminhos.length){const {error:arquivosErro}=await db.storage.from('documentos-colaboradores').remove(caminhos);if(arquivosErro)throw new Error('Cadastro excluído, mas não foi possível remover os PDFs: '+arquivosErro.message)}
    }catch(err){await carregar();if(form.classList.contains('hidden')){const aviso=document.createElement('div');aviso.className='msg';aviso.textContent='Atenção: '+err.message;lista.prepend(aviso)}else msg.textContent='Erro: '+err.message}finally{botao.disabled=false;$('#colSalvar').disabled=false}
  };
  $('#colSalvar').onclick=async()=>{
    const id=$('#colId').value,nome=$('#colNome').value.trim(),telefone=$('#colTelefone').value.trim(),nascimento=$('#colNascimento').value,possuiCnh=$('#colCnh').checked;

    if(!nome||!telefone){msg.textContent='Informe nome e telefone.';return}
    if(nascimento&&idadeColaborador(nascimento)===null){msg.textContent='Informe uma data de nascimento válida.';return}
    for(const arquivo of [documento,cnh].filter(Boolean))if(arquivo.size>10*1024*1024||!(arquivo.type==='application/pdf'||arquivo.name.toLowerCase().endsWith('.pdf'))){msg.textContent='Envie somente arquivos PDF de até 10 MB.';return}
    const atual=colaboradores.find(c=>String(c.id)===id),payload={nome,telefone,cpf:$('#colCpf').value.trim()||null,rg:$('#colRg').value.trim()||null,endereco:$('#colEndereco').value.trim()||null,sexo:$('#colSexo').value||null,data_nascimento:nascimento||null,possui_cnh:possuiCnh,blaster:$('#colBlaster').checked,atualizado_em:new Date().toISOString()};
    salvar.disabled=true;msg.textContent='Salvando cadastro...';
    try{
      const {data,error}=await (id?db.from('colaboradores').update(payload).eq('id',id).select().single():db.from('colaboradores').insert(payload).select().single());if(error)throw error;
      $('#colId').value=data.id;
      const caminhoBase=data.id;
      for(const [arquivo,coluna,tipo] of [[documento,'documento_pdf_path','documento'],[cnh,'cnh_pdf_path','cnh']]){
        if(!arquivo)continue;
        const caminho=`${caminhoBase}/${tipo}-${crypto.randomUUID()}.pdf`;
        const res=await db.storage.from('documentos-colaboradores').upload(caminho,arquivo,{contentType:'application/pdf',upsert:false});if(res.error)throw res.error;
        const {error:up}=await db.from('colaboradores').update({[coluna]:caminho}).eq('id',data.id);if(up)throw up;
      }
      form.classList.add('hidden');limpar();await carregar();
    }catch(err){msg.textContent='Erro ao salvar: '+err.message+'. Se o cadastro já foi criado, procure o nome na lista antes de tentar novamente.';await carregar()}finally{salvar.disabled=false}
  };
  await carregar();
}

function atualizarPagamento(){
  const totalCent=Math.round(Number($('#orcInvestimento').dataset.valor||0)*100);
  const modo=document.querySelector('input[name="orcCondicaoPagamento"]:checked')?.value||'avista';
  $('#orcPagamentoVista').classList.toggle('hidden',modo!=='avista');
  $('#orcPagamentoContratual').classList.toggle('hidden',modo!=='contratual');
  $('#orcValorVista').value=money(totalCent/100);
  const credito=modo==='avista'&&$('#orcFormaPagamento').value==='Cartão de crédito';
  $('#orcCartaoBox').classList.toggle('hidden',!credito);
  $('#orcCartaoValores').classList.toggle('hidden',!credito);
  if(credito){
    const n=Number($('#orcParcelasCartao').value),base=Math.floor(totalCent/n);
    $('#orcCartaoValores').innerHTML='<div class="muted" style="margin-top:8px">'+Array.from({length:n},(_,i)=>`${i+1}ª parcela: ${money((i===n-1?totalCent-base*(n-1):base)/100)}`).join(' · ')+'</div>';
  }
  if(modo!=='contratual')return;
  const percent=Number($('#orcEntradaPercentual').value||0);
  const entradaCent=Math.round(totalCent*Math.min(100,Math.max(0,Number.isFinite(percent)?percent:0))/100);
  const restanteCent=totalCent-entradaCent,n=Number($('#orcParcelasContrato').value);
  $('#orcEntradaValor').value=money(entradaCent/100);
  $('#orcRestante').value=money(restanteCent/100);
  const limite=$('#orcData').value?finAddDays($('#orcData').value,-1):'';
  if(parcelasRestanteBase!==restanteCent||parcelasRestanteQtd!==n){
    const anteriores=[...document.querySelectorAll('.contract-installment')].map(l=>({data:l.querySelector('[data-parcela-data]')?.value,forma:l.querySelector('[data-parcela-forma]')?.value}));
    const base=Math.floor(restanteCent/n);
    $('#orcParcelasContratoLista').innerHTML=Array.from({length:n},(_,i)=>{
      const valor=(i===n-1?restanteCent-base*(n-1):base)/100;
      const data=anteriores[i]?.data||'';
      const forma=anteriores[i]?.forma||'PIX';
      const formas=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Transferência'];
      return `<div class="contract-installment"><b>${i+1}ª parcela</b><div class="field"><label>Valor (R$)</label><input data-parcela-valor type="number" min="0" step="0.01" value="${valor.toFixed(2)}" inputmode="decimal"></div><div class="field"><label>Data</label><input data-parcela-data type="date" value="${esc(data)}" ${limite?`max="${limite}"`:''}></div><div class="field"><label>Forma de pagamento</label><select data-parcela-forma>${formas.map(f=>`<option ${forma===f?'selected':''}>${f}</option>`).join('')}</select></div></div>`;
    }).join('');
    parcelasRestanteBase=restanteCent;parcelasRestanteQtd=n;
  }
  document.querySelectorAll('[data-parcela-data]').forEach(c=>{if(limite)c.max=limite;else c.removeAttribute('max')});
  atualizarSomaParcelas();
}
function atualizarSomaParcelas(){
  const restanteCent=Math.round(Number($('#orcInvestimento').dataset.valor||0)*100)-Math.round(Number($('#orcEntradaPercentual').value||0)*Number($('#orcInvestimento').dataset.valor||0));
  const somaCent=[...document.querySelectorAll('[data-parcela-valor]')].reduce((s,c)=>s+Math.round(Number(c.value||0)*100),0);
  const diferenca=restanteCent-somaCent;
  const avisos=[];
  const entrada=$('#orcDataEntrada').value,evento=$('#orcData').value;
  const limite=evento?finAddDays(evento,-1):'';
  const datas=[...document.querySelectorAll('[data-parcela-data]')].map(c=>c.value);
  if(!evento)avisos.push('Informe a data do evento para definir o limite das parcelas.');
  if(entrada&&limite&&entrada>=limite)avisos.push(`A entrada é em ${finDate(entrada)} e o evento é em ${finDate(evento)}; não há data disponível depois da entrada e antes do evento.`);
  const foraPrazo=datas.findIndex(d=>d&&limite&&d>limite);
  if(foraPrazo>=0)avisos.push(`A ${foraPrazo+1}ª parcela está em ${finDate(datas[foraPrazo])}. Escolha até ${finDate(limite)} (um dia antes do evento).`);
  if(diferenca!==0)avisos.push(`Ajuste os valores das parcelas: diferença de ${money(Math.abs(diferenca)/100)} ${diferenca>0?'a distribuir':'acima do restante'}.`);
  $('#orcPagamentoMsg').textContent=avisos.join(' ');
}

      if(!Number.isFinite(p.entrada_percentual)||p.entrada_percentual<0||p.entrada_percentual>100)return 'Informe a entrada entre 0% e 100%.';
      if(!p.data_entrada)return 'Informe a data de pagamento da entrada.';
      if(p.data_entrada>=limite)return `A entrada é em ${finDate(p.data_entrada)} e o evento é em ${finDate(d.data_evento)}. Escolha uma data de evento que permita as parcelas antes dele.`;
      if(!p.parcelas_detalhes.length)return 'Selecione as parcelas do restante.';
      if(p.parcelas_detalhes.some(x=>!Number.isFinite(x.valor)||x.valor<0||!x.data||!x.forma))return 'Preencha valor, data e forma de pagamento de cada parcela.';
      const parcelaForaPrazo=p.parcelas_detalhes.find(x=>x.data>limite);
      if(parcelaForaPrazo)return `A ${parcelaForaPrazo.numero}ª parcela está em ${finDate(parcelaForaPrazo.data)}. O limite é ${finDate(limite)}, um dia antes do evento.`;
      if(p.parcelas_detalhes[0].data<=p.data_entrada)return 'A primeira parcela deve vencer depois da entrada.';
      if(p.parcelas_detalhes.some((x,i)=>i>0&&x.data<p.parcelas_detalhes[i-1].data))return 'As datas das parcelas devem ficar em ordem.';
      const somaCent=p.parcelas_detalhes.reduce((v,x)=>v+Math.round(x.valor*100),0);
      if(somaCent!==Math.round(p.restante*100))return 'A soma das parcelas deve ser igual ao restante a pagar.';
    }

  function gerarPdfProposta(d,numero,paraEnvio=false){
    if(!window.jspdf?.jsPDF)throw new Error('Não foi possível carregar o gerador de PDF.');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=210; let y=0;
    const novaPagina=()=>{pdf.addPage();cabecalho(false);y=34};
    const cabecalho=(capa=true)=>{
      pdf.setFillColor(18,22,28);pdf.rect(0,0,W,capa?42:25,'F');
      pdf.setTextColor(212,170,76);pdf.setFont('helvetica','bold');pdf.setFontSize(capa?20:14);pdf.text('CZ EFEITOS ESPECIAIS',15,capa?18:15);
      pdf.setTextColor(255,255,255);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.text('PROPOSTA COMERCIAL',15,capa?27:20);
      pdf.setTextColor(80,80,80);
    };
    cabecalho(true); y=52;
    pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.setTextColor(25,25,25);pdf.text('Proposta '+numero,15,y); y+=9;
    pdf.setFont('helvetica','normal');pdf.setFontSize(10);
    const dataFmt=d.data_evento?new Date(d.data_evento+'T00:00:00').toLocaleDateString('pt-BR'):'—';
    const infos=[['Cliente',d.cliente],['Orçamento',d.evento],['Validade',finDate(d.validade_orcamento)],['Data do evento',dataFmt],['Cidade',d.cidade_evento||'—'],['Local',d.local_evento||'—'],['Horário',d.horario||'—']];
    infos.forEach(([a,b])=>{pdf.setFont('helvetica','bold');pdf.text(a+':',15,y);pdf.setFont('helvetica','normal');pdf.text(String(b),48,y);y+=7});
    y+=4;pdf.setDrawColor(212,170,76);pdf.line(15,y,195,y);y+=10;
    pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.text('Serviços, produtos e equipamentos',15,y);y+=8;
    const linhas=[...d.produtos.map(x=>({nome:x.nome,qtd:x.quantidade,tipo:'Produto / serviço'})),...d.equipamentos.map(x=>({nome:x.nome,qtd:x.quantidade,tipo:'Equipamento'}))];
    pdf.setFontSize(9);pdf.setFillColor(242,242,242);pdf.rect(15,y-5,180,8,'F');pdf.text('Descrição',18,y);pdf.text('Tipo',135,y);pdf.text('Qtd.',185,y,{align:'right'});y+=8;
    pdf.setFont('helvetica','normal');
    linhas.forEach(x=>{if(y>265){novaPagina()} const nome=pdf.splitTextToSize(String(x.nome),108);pdf.text(nome,18,y);pdf.text(x.tipo,135,y);pdf.text(String(x.qtd),185,y,{align:'right'});y+=Math.max(7,nome.length*5);pdf.setDrawColor(230);pdf.line(15,y-3,195,y-3)});
    if(y>245){novaPagina()}
    y+=8;pdf.setFillColor(18,22,28);pdf.roundedRect(15,y,180,28,3,3,'F');
    pdf.setTextColor(255,255,255);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text('INVESTIMENTO TOTAL',22,y+9);
    pdf.setTextColor(212,170,76);pdf.setFont('helvetica','bold');pdf.setFontSize(19);pdf.text(money(d.total),22,y+21);
    y+=39;
    const linhaPagamentoPDF=(texto,destaque=false)=>{
      if(y>270)novaPagina();
      pdf.setTextColor(45,45,45);pdf.setFont('helvetica',destaque?'bold':'normal');pdf.setFontSize(destaque?10:9);
      const partes=pdf.splitTextToSize(String(texto),180);
      for(const parte of partes){if(y>275)novaPagina();pdf.text(parte,15,y);y+=5.5}
    };
    linhaPagamentoPDF('Subtotal: '+money(d.subtotal??d.total));
    linhaPagamentoPDF('Desconto ('+Number(d.desconto_percentual||0).toLocaleString('pt-BR')+'%): '+money(d.desconto_valor||0));
    y+=2;linhaPagamentoPDF('Forma e condição de pagamento',true);
    const pg=d.pagamento||{};
    if(pg.modo==='contratual'){
      linhaPagamentoPDF('Parcelamento contratual');
      linhaPagamentoPDF('Entrada ('+Number(pg.entrada_percentual||0).toLocaleString('pt-BR')+'%): '+money(pg.entrada_valor)+' • '+finDate(pg.data_entrada)+' • '+(pg.forma_entrada||'—'));
      linhaPagamentoPDF('Restante a pagar: '+money(pg.restante));
      (pg.parcelas_detalhes||[]).forEach(parcela=>linhaPagamentoPDF(String(parcela.numero)+'ª parcela: '+money(parcela.valor)+' • '+finDate(parcela.data)+' • '+(parcela.forma||'—')));
    }else if(pg.modo==='avista'){
      linhaPagamentoPDF('À vista • '+(pg.forma||'—')+' • '+money(d.total));
      if(pg.forma==='Cartão de crédito'){
        const n=Math.max(1,Math.min(10,Number(pg.parcelas||1))),cent=Math.round(Number(d.total||0)*100),base=Math.floor(cent/n);
        Array.from({length:n},(_,i)=>i).forEach(i=>linhaPagamentoPDF(String(i+1)+'ª parcela do cartão: '+money((i===n-1?cent-base*(n-1):base)/100)));
      }
    }else{
      linhaPagamentoPDF('Forma: '+(pg.forma||'—'));
      linhaPagamentoPDF('Entrada prevista (40%): '+money(d.total*.4));
      linhaPagamentoPDF('Saldo previsto (60%): '+money(d.total*.6)+' • vencimento: '+finDate(pg.vencimento_saldo));
    }
    y+=4;if(y>275)novaPagina();
    pdf.setTextColor(75,75,75);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
    pdf.text('CZ Efeitos Especiais • Proposta gerada em '+new Date().toLocaleString('pt-BR'),15,y);
    const nomeArquivo='proposta-'+String(numero).replace(/[^a-zA-Z0-9_-]/g,'-')+'-'+String(d.cliente||'cliente').replace(/[^a-zA-Z0-9_-]/g,'-')+'.pdf';
    if(paraEnvio)return {blob:pdf.output('blob'),nomeArquivo};
    pdf.save(nomeArquivo);
  }
  async function proximoNumeroProposta(){
    const {data,error}=await db.from('orcamentos').select('numero').order('criado_em',{ascending:false}).limit(200);
    if(error)throw error;
    let maior=0;
    (data||[]).forEach(x=>{const n=parseInt(String(x.numero||'').replace(/\D/g,''),10);if(Number.isFinite(n)&&n>maior)maior=n});
    return String(maior+1).padStart(3,'0');
  }
  async function salvarProposta(status='enviado'){
    const d=dadosProposta(),erro=validarProposta(d);if(erro)throw new Error(erro);
    const selecionados=[...document.querySelectorAll('.equipeNome')].map(c=>c.value).filter(Boolean);
    if(selecionados.length){
      const {data:atuais,error:erroEquipe}=await db.rpc('listar_colaboradores_ativos');
      if(erroEquipe)throw new Error('Não foi possível conferir os colaboradores ativos: '+erroEquipe.message);
      const ativos=new Set((atuais||[]).map(c=>String(c.id)));
      if(selecionados.some(id=>!ativos.has(id)))throw new Error('Um colaborador selecionado foi inativado. Abra novamente o orçamento e escolha outro.');
    }
    const numero=await proximoNumeroProposta();
    const payload={numero,status,cliente_nome:d.cliente,cliente_telefone:d.telefone||null,evento_nome:d.evento,data_evento:d.data_evento,local_evento:d.local_evento||null,valor_total:d.total,dados:d,criado_em:new Date().toISOString()};
    const {data,error}=await db.from('orcamentos').insert(payload).select('*').single();
    if(error)throw error;
    return {registro:data,d,numero};
  }

  function telefonePropostaWhats(valor){let t=String(valor||'').replace(/\D/g,'');if(t.startsWith('00'))t=t.slice(2);if(t.length===10||t.length===11)t='55'+t;return t}
  async function clienteDaProposta(p){
    if(p.dados?.cliente_id){
      const {data,error}=await db.from('clientes').select('id,nome,telefone').eq('id',p.dados.cliente_id).maybeSingle();
      if(error)throw error;if(!data)throw new Error('O cliente deste orçamento não está mais na base de clientes.');return data;
    }
    const clientes=[];
    for(let offset=0;;offset+=1000){const {data,error}=await db.from('clientes').select('id,nome,telefone').order('id').range(offset,offset+999);if(error)throw error;clientes.push(...(data||[]));if((data||[]).length<1000)break}
    const tel=telefonePropostaWhats(p.cliente_telefone||p.dados?.telefone);
    let encontrados=tel?clientes.filter(c=>telefonePropostaWhats(c.telefone)===tel):[];
    if(!encontrados.length){const nome=String(p.cliente_nome||p.dados?.cliente||'').trim().toLocaleLowerCase('pt-BR');encontrados=nome?clientes.filter(c=>String(c.nome||'').trim().toLocaleLowerCase('pt-BR')===nome):[]}
    if(encontrados.length!==1)throw new Error(encontrados.length?'Há mais de um cliente correspondente. Confira o cadastro antes de enviar.':'Cliente não encontrado na base de clientes.');
    return encontrados[0];
  }
  async function enviarPropostaWhats(p,btn){
    if(btn.disabled)return;
    const msg=$('#orcEnvioMsg');if(msg){msg.textContent='Preparando PDF e conferindo telefone do cliente...';msg.style.color='var(--muted)'}
    btn.disabled=true;btn.setAttribute('aria-busy','true');
    const janela=window.open('about:blank','_blank');
    if(janela){janela.opener=null;janela.document.title='Preparando proposta';janela.document.body.textContent='Preparando a proposta para abrir no WhatsApp...'}
    try{
      if(!p.dados||typeof p.dados!=='object')throw new Error('Esta proposta não tem os dados salvos para gerar o PDF.');
      const cliente=await clienteDaProposta(p),telefone=telefonePropostaWhats(cliente.telefone);
      if(!/^\d{12,15}$/.test(telefone))throw new Error('Confira o telefone com DDD na base de clientes.');
      const {blob,nomeArquivo}=gerarPdfProposta(p.dados,p.numero||'sem-numero',true);
      const caminho=String(p.id)+'/'+crypto.randomUUID()+'/'+nomeArquivo;
      const {error:erroUpload}=await db.storage.from('propostas-pdf').upload(caminho,blob,{contentType:'application/pdf',upsert:false});
      if(erroUpload)throw new Error('Não foi possível salvar o PDF. Execute o SQL de envio de propostas. '+erroUpload.message);
      const {data:arquivo,error:erroLink}=await db.storage.from('propostas-pdf').createSignedUrl(caminho,604800,{download:nomeArquivo});
      if(erroLink||!arquivo?.signedUrl)throw new Error('Não foi possível preparar o link do PDF: '+(erroLink?.message||'link indisponível'));
      const texto=`Olá ${cliente.nome||''}! Segue a proposta ${p.numero||''} da CZ Efeitos Especiais para ${p.evento_nome||p.dados.evento||'seu evento'}.\n\nPDF da proposta:\n${arquivo.signedUrl}\n\nO link fica disponível por 7 dias.`;
      const url='https://wa.me/'+telefone+'?text='+encodeURIComponent(texto);
      if(janela&&!janela.closed)janela.location.replace(url);
      if(msg){msg.style.color='#55d884';msg.innerHTML='Proposta preparada. Confirme o envio no WhatsApp. <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" style="color:#7db9ff">Abrir conversa</a>'}
    }catch(err){if(janela&&!janela.closed)janela.close();if(msg){msg.style.color='#ff8b78';msg.textContent='Erro ao preparar proposta: '+(err.message||'Tente novamente.')}else alert(err.message)}
    finally{btn.disabled=false;btn.removeAttribute('aria-busy')}
  }

Obrigado!`;

  async function excluirProposta(id){
    if(!await czConfirm('Excluir esta proposta? Se existir um evento vinculado e ele ainda não estiver FINALIZADO, todo o processo operacional desse orçamento também será excluído. Eventos finalizados serão preservados.','Excluir proposta','Excluir'))return;
    try{
      const {data:orc,error:eo}=await db.from('orcamentos').select('id,dados').eq('id',id).single();
      if(eo)throw eo;
      const eventoId=orc?.dados?.evento_operacional_id||null;
      if(eventoId){
        const {data:ev,error:ee}=await db.from('eventos_operacionais').select('id,status,saida_baixada_em').eq('id',eventoId).maybeSingle();
        if(ee)throw ee;
        if(ev?.saida_baixada_em)throw new Error('A proposta está vinculada a um evento que já movimentou o estoque. Preserve o histórico do evento e da proposta.');
        if(ev&&ev.status!=='finalizado'){
          const {error:em}=await db.from('evento_materiais').delete().eq('evento_id',eventoId);
          if(em)throw em;
          const {error:ed}=await db.from('eventos_operacionais').delete().eq('id',eventoId);
          if(ed)throw ed;
        }
      }
      const {error}=await db.from('orcamentos').delete().eq('id',id);
      if(error)throw error;
      await carregarPropostasSalvas();
    }catch(error){alert('Não foi possível excluir a proposta: '+error.message)}
  }

  function calcularPrecosProduto(){
  const custo = Number($('#productCost')?.value || 0);
  const varejoPercent = Number($('#productRetailPercent')?.value || 0);
  const atacadoPercent = Number($('#productWholesalePercent')?.value || 0);

  const varejoLucro = custo * (varejoPercent / 100);
  const atacadoLucro = custo * (atacadoPercent / 100);

  if($('#productRetail')) $('#productRetail').value = (custo + varejoLucro).toFixed(2);
  if($('#productRetailProfit')) $('#productRetailProfit').value = varejoLucro.toFixed(2);

  if($('#productWholesale')) $('#productWholesale').value = (custo + atacadoLucro).toFixed(2);
  if($('#productWholesaleProfit')) $('#productWholesaleProfit').value = atacadoLucro.toFixed(2);
}

['productCost','productRetailPercent','productWholesalePercent'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', calcularPrecosProduto);
});
function atualizarLucroPeloValor(tipo){
  const custo=Number($('#productCost').value||0);
  const campoValor=tipo==='varejo'?'#productRetail':'#productWholesale';
  const campoPercent=tipo==='varejo'?'#productRetailPercent':'#productWholesalePercent';
  const campoLucro=tipo==='varejo'?'#productRetailProfit':'#productWholesaleProfit';
  const lucro=Number($(campoValor).value||0)-custo;
  $(campoLucro).value=lucro.toFixed(2);
  $(campoPercent).value=custo>0?((lucro/custo)*100).toFixed(2):'0';
}
$('#productRetail').addEventListener('input',()=>atualizarLucroPeloValor('varejo'));

async function renderShoppingList(){
  const [compras,cadastro]=await Promise.all([
    db.from('lista_compras').select('*').order('criado_em',{ascending:false}),
    db.from('produtos').select('id,nome,marca,fornecedor,valor_custo,estoque_atual,estoque_minimo,codigo_barras')
  ]);
  if(compras.error||cadastro.error){$('#content').innerHTML=`<div class="msg">Erro ao carregar Lista de compra: ${esc((compras.error||cadastro.error).message)}</div>`;return}
  const porId=new Map((cadastro.data||[]).map(p=>[String(p.id),p]));
  const linhas=(compras.data||[]).map(item=>({...item,produto:porId.get(String(item.produto_id))}));
  $('#content').innerHTML=`<div class="sectionhead"><div><h2>Lista de compra</h2><div class="muted">${linhas.length} produto(s)</div></div><div class="actions"><button id="purchasePdf" type="button" class="btn primary" ${linhas.length?'':'disabled'}>Gerar PDF</button><button class="btn secondary" onclick="renderModule(5)">Ver Estoque</button></div></div><div id="purchaseMsg" class="msg" role="status"></div><div class="tablewrap">${linhas.length?`<table><thead><tr><th>Produto</th><th>Marca</th><th>Fornecedor</th><th>Qtd. para comprar</th><th>Última compra (un.)</th><th>Total último custo</th><th>Novo valor (un.)</th><th>Total compra atual</th><th>Ações</th></tr></thead><tbody>${linhas.map((item,i)=>{const p=item.produto;return `<tr data-purchase-row="${i}"><td>${esc(p?.nome||'Produto removido do cadastro')}</td><td>${esc(p?.marca||'—')}</td><td>${esc(p?.fornecedor||'—')}</td><td><input class="purchase-input" data-purchase-qty="${i}" type="number" min="0.01" step="0.01" value="${Number(item.quantidade??1)}" aria-label="Quantidade para comprar de ${esc(p?.nome||'produto')}"></td><td>${money(p?.valor_custo)}</td><td data-last-total="${i}"></td><td><input class="purchase-input" data-purchase-current="${i}" type="number" min="0" step="0.01" value="${item.valor_compra_atual??''}" placeholder="Preencher" aria-label="Novo valor unitário de ${esc(p?.nome||'produto')}"></td><td data-current-total="${i}"></td><td><button type="button" class="btn danger" data-remove-purchase="${esc(item.produto_id)}">Remover</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">A lista está vazia. Adicione produtos pelo Estoque.</div>'}</div><div class="card" style="margin-top:16px"><div>Total pelo último custo: <strong id="purchaseGrandLast">R$ 0,00</strong></div><div style="margin-top:8px">Total da compra atual: <strong id="purchaseGrandCurrent">R$ 0,00</strong> <span id="purchasePending" class="muted"></span></div></div>`;
  const pendentes=new Set();
  const atualizarTotais=()=>{
    let ultimo=0,atual=0,faltando=0;
    linhas.forEach((item,i)=>{
      const q=Number($(`[data-purchase-qty="${i}"]`).value);
      const raw=$(`[data-purchase-current="${i}"]`).value;
      const novo=raw===''?null:Number(raw);
      const anterior=Number(item.produto?.valor_custo||0);
      const quantidade=Number.isFinite(q)&&q>0?q:0;
      ultimo+=quantidade*anterior;
      $(`[data-last-total="${i}"]`).textContent=money(quantidade*anterior);
      if(novo===null||!Number.isFinite(novo)||novo<0){faltando++;$(`[data-current-total="${i}"]`).textContent='Pendente'}
      else {atual+=quantidade*novo;$(`[data-current-total="${i}"]`).textContent=money(quantidade*novo)}
    });
    $('#purchaseGrandLast').textContent=money(ultimo);
    $('#purchaseGrandCurrent').textContent=money(atual);
    $('#purchasePending').textContent=faltando?`(${faltando} preço(s) pendente(s))`:'';
  };
  $('#content').onclick=e=>{const btn=e.target.closest('[data-remove-purchase]');if(btn)removePurchaseItem(btn.dataset.removePurchase,btn)};
  $('#content').oninput=e=>{if(e.target.matches('[data-purchase-qty],[data-purchase-current]'))atualizarTotais()};
  $('#content').onchange=e=>{
    const input=e.target;
    const tipo=input.dataset.purchaseQty!==undefined?'quantidade':input.dataset.purchaseCurrent!==undefined?'valor_compra_atual':null;
    if(!tipo)return;
    const i=Number(tipo==='quantidade'?input.dataset.purchaseQty:input.dataset.purchaseCurrent);
    const item=linhas[i],raw=input.value;
    const valor=raw===''&&tipo==='valor_compra_atual'?null:Number(raw);
    if((tipo==='quantidade'&&(!Number.isFinite(valor)||valor<=0))||(valor!==null&&(!Number.isFinite(valor)||valor<0))){
      $('#purchaseMsg').textContent=tipo==='quantidade'?'Informe uma quantidade maior que zero.':'Informe um valor de compra válido.';
      input.value=item[tipo]??'';atualizarTotais();return;
    }
    input.disabled=true;
    const salvar=(async()=>{
      const {error}=await db.from('lista_compras').update({[tipo]:valor}).eq('produto_id',item.produto_id);
      input.disabled=false;
      if(error){$('#purchaseMsg').textContent='Erro ao salvar: '+error.message;input.value=item[tipo]??''}
      else {item[tipo]=valor;$('#purchaseMsg').textContent='Lista de compra atualizada.'}
      atualizarTotais();
    })();
    pendentes.add(salvar);salvar.finally(()=>pendentes.delete(salvar));
  };
  $('#purchasePdf').onclick=async()=>{await Promise.all([...pendentes]);gerarPdfCompras(linhas)};
  atualizarTotais();
}
function gerarPdfCompras(linhas){
  if(!window.jspdf?.jsPDF){$('#purchaseMsg').textContent='Não foi possível carregar o gerador de PDF. Atualize a página e tente novamente.';return}
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const xs=[12,62,90,132,149,183,217,253],larguras=[48,26,40,15,32,32,34,32];
  const cabecalhos=['Produto','Marca','Fornecedor','Qtd.','Último un.','Novo un.','Total último','Total atual'];
  let y=0;
  function cabecalho(){
    pdf.setFillColor(22,31,42);pdf.rect(0,0,297,30,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(16);pdf.text('CZ Efeitos Especiais | Lista de compra',12,15);
    pdf.setFontSize(9);pdf.text(new Date().toLocaleString('pt-BR'),285,15,{align:'right'});
    pdf.setTextColor(30,35,40);pdf.setFontSize(8);pdf.setFont('helvetica','bold');
    cabecalhos.forEach((h,i)=>pdf.text(h,xs[i],36));pdf.setDrawColor(180);pdf.line(12,39,285,39);pdf.setFont('helvetica','normal');y=42;
  }
  cabecalho();let totalAnterior=0,totalAtual=0,faltando=0;
  linhas.forEach(item=>{
    if(y>181){pdf.addPage();cabecalho()}
    const quantidade=Number(item.quantidade||1),anterior=Number(item.produto?.valor_custo||0);
    const novo=item.valor_compra_atual===null||item.valor_compra_atual===undefined?null:Number(item.valor_compra_atual);
    totalAnterior+=quantidade*anterior;if(novo===null)faltando++;else totalAtual+=quantidade*novo;
    const p=item.produto||{};
    const valores=[p.nome||'Produto removido',p.marca||'—',p.fornecedor||'—',String(quantidade),money(anterior),novo===null?'Pendente':money(novo),money(quantidade*anterior),novo===null?'Pendente':money(quantidade*novo)];
    pdf.setFontSize(8);
    valores.forEach((v,i)=>{const texto=pdf.splitTextToSize(String(v),larguras[i]).slice(0,2);pdf.text(texto,xs[i],y+4)});
    pdf.setDrawColor(225);pdf.line(12,y+11,285,y+11);y+=13;
  });
  if(y>177){pdf.addPage();cabecalho()}
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);
  pdf.text('Total pelo último custo: '+money(totalAnterior),12,y+9);
  pdf.text('Total da compra atual: '+money(totalAtual)+(faltando?` (${faltando} preço(s) pendente(s))`:''),12,y+16);
  pdf.save('lista-de-compra-cz-'+new Date().toISOString().slice(0,10)+'.pdf');
}

function validarDatasMontagem(inicio,termino,mensagem){
  // Datas e horário de montagem são opcionais. Só valida a ordem quando as duas datas forem informadas.
  if(inicio&&termino&&termino<inicio){mensagem.textContent='O término da montagem não pode ser antes do início.';return false}
  return true;
}
function projetoExecucaoMarkup(shapes=[]){
  const n=v=>Math.max(0,Math.min(900,Number(v)||0));
  return (Array.isArray(shapes)?shapes:[]).map((s,i)=>{
    const a=`data-shape-index="${i}" stroke="#bd6621" stroke-width="3"`;
    if(s.tipo==='retangulo')return `<rect ${a} x="${n(s.x)}" y="${n(s.y)}" width="${n(s.w)}" height="${n(s.h)}" fill="rgba(212,170,76,.12)"/>`;
    if(s.tipo==='linha')return `<line ${a} x1="${n(s.x1)}" y1="${n(s.y1)}" x2="${n(s.x2)}" y2="${n(s.y2)}"/>`;
    if(s.tipo==='circulo')return `<circle ${a} cx="${n(s.cx)}" cy="${n(s.cy)}" r="${n(s.r)}" fill="rgba(212,170,76,.12)"/>`;
    if(s.tipo==='texto')return `<text data-shape-index="${i}" x="${n(s.x)}" y="${n(s.y)}" fill="#17202a" font-size="19" font-family="Arial,sans-serif">${esc(String(s.texto||'').slice(0,120))}</text>`;
    return '';
  }).join('');
}

function configurarEditorProjeto(shapes){
  const svg=$('#tecProjeto');let ferramenta='selecionar',selecionado=-1,inicio=null,preview=null;
  const desenhar=()=>{svg.innerHTML=projetoExecucaoMarkup(preview?[...shapes,preview]:shapes);if(selecionado>=0)svg.querySelector(`[data-shape-index="${selecionado}"]`)?.setAttribute('stroke','#1671a8')};
  const ponto=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const t=p.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(0,Math.min(900,Math.round(t.x))),y:Math.max(0,Math.min(500,Math.round(t.y)))}};
  const figura=(a,b)=>ferramenta==='retangulo'?{tipo:'retangulo',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.max(12,Math.abs(a.x-b.x)),h:Math.max(12,Math.abs(a.y-b.y))}:ferramenta==='linha'?{tipo:'linha',x1:a.x,y1:a.y,x2:b.x,y2:b.y}:{tipo:'circulo',cx:a.x,cy:a.y,r:Math.max(8,Math.min(250,Math.hypot(a.x-b.x,a.y-b.y)))};
  svg.onpointerdown=async ev=>{const alvo=ev.target.closest('[data-shape-index]');if(ferramenta==='selecionar'){selecionado=alvo?Number(alvo.dataset.shapeIndex):-1;desenhar();return}if(ferramenta==='texto'){const label=await czPrompt('Escreva o nome ou observação neste ponto:','','Texto do projeto');if(label?.trim()){const p=ponto(ev);shapes.push({tipo:'texto',x:p.x,y:p.y,texto:label.trim().slice(0,120)});desenhar()}return}inicio=ponto(ev);svg.setPointerCapture(ev.pointerId)};
  svg.onpointermove=ev=>{if(inicio){preview=figura(inicio,ponto(ev));desenhar()}};
  svg.onpointerup=ev=>{if(!inicio)return;const fim=ponto(ev);if(Math.abs(fim.x-inicio.x)<4&&Math.abs(fim.y-inicio.y)<4){fim.x=Math.min(900,inicio.x+80);fim.y=Math.min(500,inicio.y+60)}shapes.push(figura(inicio,fim));inicio=null;preview=null;desenhar()};
  svg.onpointercancel=()=>{inicio=null;preview=null;desenhar()};
  document.querySelectorAll('[data-tec-tool]').forEach(btn=>btn.onclick=()=>{ferramenta=btn.dataset.tecTool;document.querySelectorAll('[data-tec-tool]').forEach(x=>x.classList.toggle('active',x===btn));selecionado=-1;desenhar()});
  $('#tecApagar').onclick=()=>{if(selecionado>=0){shapes.splice(selecionado,1);selecionado=-1;desenhar()}};
  desenhar();
}

  const [op,mat,cl]=await Promise.all([db.from('orcamentos').select('*').eq('id',e.origem_orcamento_id).single(),db.from('evento_materiais').select('*').eq('evento_id',id),db.from('clientes').select('endereco').eq('id',e.cliente_id).maybeSingle()]);

}

 <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">✅ Material conferidos</h3><div class="tablewrap">${conferidos.length?`<table><thead><tr><th>Quant.</th><th>Descrição</th><th>Cód.</th><th>Conf.</th><th>Horário e data da conf.</th><th>Status</th></tr></thead><tbody>${conferidos.map(m=>`<tr><td>${m.quantidade_necessaria}</td><td>${esc(m.nome_item)}</td><td><b>${esc(m.codigo||'—')}</b></td><td><b>${m.quantidade_bipada}/${m.quantidade_necessaria}</b></td><td>${registroConferencia(m.id)}</td><td>✅</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum material conferido ainda.</div>'}</div></div>

async function adicionarMaterialEvento(eventoId){
 const [pr,ar]=await Promise.all([db.from('produtos').select('id,nome,codigo_barras').order('nome'),db.from('ativos').select('id,nome,codigo_barras,codigo_interno,status').order('nome')]);
 const op=[...(pr.data||[]).map(x=>({tipo:'produto',...x,codigo:x.codigo_barras||''})),...(ar.data||[]).map(x=>({tipo:'ativo',...x,codigo:x.codigo_barras||x.codigo_interno||''}))];
 const escolha=await czPrompt('Digite parte do nome ou código do material:','','Adicionar material');if(!escolha)return;const q=textoFiltro(escolha);const achados=op.filter(x=>textoFiltro(x.nome).includes(q)||textoFiltro(x.codigo).includes(q));if(!achados.length){alert('Material não encontrado.');return}let item=achados[0];if(achados.length>1){const lista=achados.slice(0,10).map((x,i)=>`${i+1} - ${x.nome} (${x.codigo||'sem código'})`).join('\n');const n=Number(await czPrompt('Escolha o número:\n'+lista,'','Escolher material'));if(!n||!achados[n-1])return;item=achados[n-1]}
 const qtd=Number(await czPrompt('Quantidade necessária:','1','Quantidade'));if(!Number.isInteger(qtd)||qtd<=0){alert('Informe uma quantidade inteira maior que zero.');return}
 const {error}=await db.from('evento_materiais').insert({evento_id:eventoId,tipo:item.tipo,item_id:item.id,nome_item:item.nome,codigo:item.codigo||null,quantidade_necessaria:qtd,quantidade_bipada:0,origem:'extra'});if(error){alert('Erro: '+error.message);return}abrirEvento(eventoId);
}
function normalizarCodigoEvento(v){return String(v??'').replace(/[\r\n\t ]+/g,'').trim().toUpperCase()}
let bipagemEventoEmAndamento=false;
async function biparEvento(eventoId){
 const campo=$('#scanEvento'),msg=$('#scanMsg');
 if(bipagemEventoEmAndamento)return;
 const codigoLido=normalizarCodigoEvento(campo?.value);
 if(!codigoLido){if(msg)msg.textContent='Bipe ou digite um código.';campo?.focus();return}
 bipagemEventoEmAndamento=true;
 if(msg){msg.style.color='var(--muted)';msg.textContent='Conferindo '+codigoLido+'...'}
 try{
   const {data:mats,error}=await db.from('evento_materiais').select('*').eq('evento_id',eventoId).order('criado_em');
   if(error)throw error;
   let candidatos=(mats||[]).filter(m=>normalizarCodigoEvento(m.codigo)===codigoLido);

   // Compatibilidade com eventos antigos: se o código não foi gravado em evento_materiais,
   // confere o cadastro atual do produto/ativo pelo item_id e corrige o código do evento.
   if(!candidatos.length){
     const produtos=(mats||[]).filter(m=>m.tipo==='produto'&&m.item_id).map(m=>m.item_id);
     const ativos=(mats||[]).filter(m=>m.tipo==='ativo'&&m.item_id).map(m=>m.item_id);
     let codigos=new Map();
     if(produtos.length){const r=await db.from('produtos').select('id,codigo_barras').in('id',produtos);if(r.error)throw r.error;(r.data||[]).forEach(x=>codigos.set('produto:'+x.id,x.codigo_barras||''))}
     if(ativos.length){const r=await db.from('ativos').select('id,codigo_barras,codigo_interno').in('id',ativos);if(r.error)throw r.error;(r.data||[]).forEach(x=>codigos.set('ativo:'+x.id,x.codigo_barras||x.codigo_interno||''))}
     candidatos=(mats||[]).filter(m=>normalizarCodigoEvento(codigos.get(m.tipo+':'+m.item_id))===codigoLido);
     for(const m of candidatos){if(!normalizarCodigoEvento(m.codigo)){await db.from('evento_materiais').update({codigo:codigos.get(m.tipo+':'+m.item_id)}).eq('id',m.id)}}
   }

   const item=candidatos.find(m=>Number(m.quantidade_bipada||0)<Number(m.quantidade_necessaria||0));
   if(!item){
     if(msg){msg.style.color='#ffb0b0';msg.textContent=candidatos.length?'Quantidade deste item já está completa.':'Código '+codigoLido+' não pertence aos materiais deste evento.'}
     campo?.select();campo?.focus();return;
   }
   const novo=Number(item.quantidade_bipada||0)+1;
   const {data:salvo,error:up}=await db.from('evento_materiais').update({quantidade_bipada:novo}).eq('id',item.id).select('id,quantidade_bipada').maybeSingle();
   if(up)throw up;
   if(!salvo)throw new Error('O banco não autorizou a atualização deste material. Verifique as permissões da tabela evento_materiais.');
   if(Number(salvo.quantidade_bipada)!==novo)throw new Error('A quantidade não foi gravada corretamente no banco.');
   try{localStorage.setItem('cz_conf_'+item.id,new Date().toISOString())}catch(_){}
   if(campo)campo.value='';
   await abrirEvento(eventoId);
 }catch(err){
   if(msg){msg.style.color='#ffb0b0';msg.textContent='Erro na conferência: '+(err?.message||err)}
   else alert('Erro na conferência: '+(err?.message||err));
   campo?.focus();
 }finally{bipagemEventoEmAndamento=false}
}
async function concluirConferenciaEvento(id){
  const [er,mr]=await Promise.all([db.from('eventos_operacionais').select('status').eq('id',id).single(),db.from('evento_materiais').select('quantidade_necessaria,quantidade_bipada').eq('evento_id',id)]);
  if(er.error||mr.error){alert((er.error||mr.error).message);return}
  if(!['separando','aguardando_evento','pronto','aguardando_separacao'].includes(er.data.status)){alert('O evento não está em conferência.');return}
  if(!mr.data?.length||mr.data.some(x=>Number(x.quantidade_bipada||0)<Number(x.quantidade_necessaria||0))){alert('Confira todos os materiais antes de concluir.');return}
  const {error}=await db.from('eventos_operacionais').update({status:'material_pronto',relatorio_impresso_em:null,atualizado_em:new Date().toISOString()}).eq('id',id);
  if(error){alert(error.message);return}abrirEvento(id);
}

  janela.document.open();janela.document.write(html);janela.document.close();janela.focus();janela.print();

async function confirmarImpressaoEvento(id){
  if(!$('#relatorioImpresso')?.checked){alert('Marque a confirmação depois de imprimir o relatório de campo.');return}
  const {data:e,error:er}=await db.from('eventos_operacionais').select('status').eq('id',id).single();
  if(er){alert(er.message);return}if(e.status!=='material_pronto'){alert('Conclua a conferência antes de confirmar o relatório.');return}
  const {error}=await db.from('eventos_operacionais').update({relatorio_impresso_em:new Date().toISOString(),atualizado_em:new Date().toISOString()}).eq('id',id);

}

async function excluirEvento(id,origem='eventos'){
 if(!contaMaster()){alert('Somente a conta Master pode excluir eventos.');return}
 const {data:ev,error:evErro}=await db.from('eventos_operacionais').select('nome_evento,saida_baixada_em').eq('id',id).maybeSingle();
 if(evErro){alert('Não foi possível verificar o evento: '+evErro.message);return}
 if(ev?.saida_baixada_em){alert('Este evento já movimentou o estoque. Mantenha o histórico para preservar as quantidades.');return}
 const nome=ev?.nome_evento||'este evento';
 if(!await czConfirm(`Excluir definitivamente ${nome}? Esta ação não poderá ser desfeita.`,'Excluir definitivamente','Excluir'))return;
 const {error:merr}=await db.from('evento_materiais').delete().eq('evento_id',id);
 if(merr){alert('Não foi possível excluir os materiais do evento: '+merr.message);return}
 const {error}=await db.from('eventos_operacionais').delete().eq('id',id);
 if(error){alert('Não foi possível excluir o evento: '+error.message);return}
 if(origem==='retorno')renderRetornoEventos();else renderEventos();
}
async function abrirRetornoEvento(id){
 const [evr,matr]=await Promise.all([db.from('eventos_operacionais').select('*').eq('id',id).single(),db.from('evento_materiais').select('*').eq('evento_id',id).order('criado_em')]);if(evr.error||matr.error){alert((evr.error||matr.error).message);return}
 const e=evr.data,mats=(matr.data||[]).filter(m=>Number(m.quantidade_bipada||0)>0);const finalizado=e.status==='finalizado';
 const linhas=mats.map(m=>{const r=retornoInfoMaterial(m,e),esperado=Number(m.quantidade_bipada||0),q=Math.min(Number(r.qtd||0),esperado),ok=q>=esperado,perda=r.status==='perda',man=r.status==='manutencao';return `<tr><td>${esperado}</td><td><b>${esc(m.nome_item)}</b><div class="muted">${m.tipo==='ativo'?'Ativo':'Consumo'}</div></td><td><b>${esc(m.codigo||'—')}</b></td><td>${q}/${esperado}</td><td>${dataUltimoRetornoMaterial(m,e)}</td><td>${man?'🛠️ Manutenção':perda?'⚠️ Perda':ok?'✅ Devolvido':'🟥 Pendente'}</td><td>${m.tipo==='ativo'&&!finalizado&&!perda&&!man&&!ok?`<button class="btn secondary" onclick="marcarManutencaoRetorno('${id}','${m.id}','${m.item_id||''}')">Manutenção</button> <button class="btn danger" onclick="marcarPerdaRetorno('${id}','${m.id}','${m.item_id||''}')">Perda</button>`:(m.tipo==='produto'?'<span class="muted">Conferir devolução</span>':'—')}</td></tr>`}).join('');
 $('#content').innerHTML=`<div class="sectionhead"><div><h2>↩️ Retorno — ${esc(e.nome_evento)}</h2><div class="muted">${esc(e.cliente_nome||'')} • compare a devolução com a conferência de saída</div></div><button class="btn secondary" onclick="renderRetornoEventos()">Voltar</button></div><div class="card" style="margin-bottom:16px"><div><b>Status:</b> ${statusEventoLabel(e.status)}</div>${!finalizado?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="scanRetorno" placeholder="Bipe o código devolvido" autocomplete="off" style="flex:1;min-width:240px;background:#0b1118;color:#fff;border:1px solid var(--line);border-radius:9px;padding:12px"><button class="btn primary" id="btnRetorno">CONF. DEVOLUÇÃO</button></div><div id="retMsg" class="msg"></div>`:''}</div><div class="tablewrap"><table><thead><tr><th>Qtd. saída</th><th>Descrição</th><th>Cód.</th><th>Retorno</th><th>Data e hora</th><th>Status</th><th>Ocorrência</th></tr></thead><tbody>${linhas||'<tr><td colspan="7">Nenhum item registrado na saída.</td></tr>'}</tbody></table></div>${!finalizado?`<div class="card" style="margin-top:16px"><div class="muted">Ativos precisam ser devolvidos, enviados para manutenção ou marcados como perda. Consumíveis e ativos devolvidos voltam ao estoque no momento da conferência.</div><div class="actions"><button class="btn primary" onclick="finalizarRetornoEvento('${id}')">CONCLUIR RETORNO DO EVENTO</button></div></div>`:''}`;
 if(!finalizado){$('#btnRetorno').onclick=()=>biparRetornoEvento(id);$('#scanRetorno').addEventListener('keydown',x=>{if(x.key==='Enter')biparRetornoEvento(id)});$('#scanRetorno').focus()}
}
async function biparRetornoEvento(eventoId){
 const c=$('#scanRetorno'),codigo=c.value.trim();if(!codigo){$('#retMsg').textContent='Bipe ou digite um código.';return}
 const {data:e,error:evErro}=await db.from('eventos_operacionais').select('saida_baixada_em,status').eq('id',eventoId).single();
 if(evErro){$('#retMsg').textContent=evErro.message;return}
 if(e.saida_baixada_em){
   const {error}=await db.rpc('cz_confirmar_retorno_evento',{p_evento_id:eventoId,p_codigo:codigo});
   if(error){$('#retMsg').textContent='Não foi possível conferir: '+error.message;return}
   c.value='';await abrirRetornoEvento(eventoId);return;
 }
 const {data,error}=await db.from('evento_materiais').select('*').eq('evento_id',eventoId).eq('codigo',codigo);if(error){$('#retMsg').textContent=error.message;return}
 const m=(data||[]).find(x=>Number(x.quantidade_bipada||0)>0);if(!m){$('#retMsg').textContent='Este código não consta na saída deste evento.';return}
 const esperado=Number(m.quantidade_bipada||0),r=retornoInfo(m.id);if(Number(r.qtd||0)>=esperado){$('#retMsg').textContent='A devolução deste item já está completa.';return}
 r.qtd=Number(r.qtd||0)+1;r.registros=[...(r.registros||[]),new Date().toISOString()];r.status='devolvido';salvarRetorno(m.id,r);
 if(m.tipo==='produto'&&m.item_id){const {data:p}=await db.from('produtos').select('estoque_atual').eq('id',m.item_id).single();if(p){const {error:up}=await db.from('produtos').update({estoque_atual:Number(p.estoque_atual||0)+1}).eq('id',m.item_id);if(up){r.qtd--;r.registros.pop();salvarRetorno(m.id,r);$('#retMsg').textContent='Não foi possível devolver ao estoque: '+up.message;return}}}
 if(m.tipo==='ativo'&&m.item_id)await db.from('ativos').update({status:'disponivel'}).eq('id',m.item_id);c.value='';abrirRetornoEvento(eventoId)
}
async function registrarOcorrenciaRetorno(eventoId,mid,ativoId,tipo){
 if(tipo==='perda'&&!await czConfirm('Confirmar este ativo como perda?','Registrar perda','Confirmar perda'))return;
 const {data:e,error:evErro}=await db.from('eventos_operacionais').select('saida_baixada_em').eq('id',eventoId).single();if(evErro){alert(evErro.message);return}
 if(e.saida_baixada_em){const {error}=await db.rpc('cz_ocorrencia_retorno_ativo',{p_evento_id:eventoId,p_material_id:mid,p_ocorrencia:tipo});if(error){alert(error.message);return}abrirRetornoEvento(eventoId);return}
 const r=retornoInfo(mid);r.status=tipo;salvarRetorno(mid,r);
 if(ativoId){const {error}=await db.from('ativos').update({status:tipo==='perda'?'perdido':'manutencao'}).eq('id',ativoId);if(error){alert(error.message);return}}
 abrirRetornoEvento(eventoId);
}
function marcarManutencaoRetorno(eventoId,mid,ativoId){return registrarOcorrenciaRetorno(eventoId,mid,ativoId,'manutencao')}
function marcarPerdaRetorno(eventoId,mid,ativoId){return registrarOcorrenciaRetorno(eventoId,mid,ativoId,'perda')}
async function finalizarRetornoEvento(id){
 const {data:e,error:evErro}=await db.from('eventos_operacionais').select('saida_baixada_em').eq('id',id).single();if(evErro){alert(evErro.message);return}
 if(e.saida_baixada_em){
   if(!await czConfirm('Concluir o retorno e finalizar este evento?','Concluir retorno','Finalizar evento'))return;
   const {error}=await db.rpc('cz_concluir_retorno_evento',{p_evento_id:id});if(error){alert(error.message);return}
   renderRetornoEventos();return;
 }
 const {data:m,error}=await db.from('evento_materiais').select('*').eq('evento_id',id);if(error){alert(error.message);return}
 const ativos=(m||[]).filter(x=>x.tipo==='ativo'&&Number(x.quantidade_bipada||0)>0);
 const pend=ativos.filter(x=>{const r=retornoInfo(x.id);return Number(r.qtd||0)<Number(x.quantidade_bipada||0)&&!['perda','manutencao'].includes(r.status)});
 if(pend.length){alert('Ainda existem ativos sem retorno. Bipe o ativo ou marque a ocorrência como Manutenção ou Perda.');return}
 if(!await czConfirm('Concluir o retorno e finalizar este evento?','Concluir retorno','Finalizar evento'))return;
 const {error:up}=await db.from('eventos_operacionais').update({status:'finalizado',atualizado_em:new Date().toISOString()}).eq('id',id);
 if(up){alert(up.message);return}renderRetornoEventos()
}
async function removerMaterialEvento(id,eventoId){if(!await czConfirm('Remover este material do evento?','Remover material','Remover'))return;const {error}=await db.from('evento_materiais').delete().eq('id',id);if(error){alert(error.message);return}abrirEvento(eventoId)}
async function mudarStatusEvento(id,status){const {error}=await db.from('eventos_operacionais').update({status,atualizado_em:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}abrirEvento(id)}
