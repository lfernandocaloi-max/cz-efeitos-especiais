<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CZ Efeitos Especiais — Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090d12;--panel:#111821;--panel2:#161f2a;--line:#273342;--text:#f5f7f8;--muted:#94a0ae;--accent:#ff641f;--ok:#38b86b;--danger:#ef5350}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.brand{font-size:34px;font-weight:900;color:var(--accent);line-height:.9}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#fff;margin-top:8px}.field{margin-top:16px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0b1118;color:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;outline:none}.field textarea{min-height:90px}.thumb{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#0b1118}.preview{width:140px;height:140px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#0b1118;margin-top:10px}.btn{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#22303d;color:#fff}.danger{background:#3a1e21;color:#ffb0b0}.full{width:100%}.msg{margin-top:12px;color:#ffb0b0;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#070d11;border-right:1px solid var(--line);padding:22px 14px}.side .brand{margin:4px 8px 26px}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:4px 0;border:0;border-radius:8px;background:transparent;color:#cbd4dc;cursor:pointer}.nav button:hover,.nav button.active{background:#1c2833;color:#fff}.nav button.active{border-left:3px solid var(--accent)}.main{min-width:0}.top{height:68px;background:#10171f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.card .n{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sectionhead h2{margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);background:#0e151d}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.placeholder{padding:36px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards,.row{grid-template-columns:1fr}.content{padding:16px}.top{padding:0 16px}}
</style>
</head><body>
<section id="login" class="login"><div class="loginbox"><div class="brand">CZ<small>EFEITOS ESPECIAIS</small></div><h3>Acesso ao sistema</h3><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary full" style="margin-top:18px">ENTRAR</button><<button type="button" class="btn secondary full" style="margin-top:8px" onclick="recuperarSenha()">Esqueci minha senha</button>div id="loginMsg" class="msg"></div></div></section>
<div id="app" class="app hidden"><aside class="side"><div class="brand">CZ<small>EFEITOS ESPECIAIS</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><b id="pageTitle">Dashboard</b><div class="muted" style="font-size:12px">Sistema de gestão CZ</div></div><div><span id="userName" class="muted"></span> <button id="logoutBtn" class="btn secondary">Sair</button></div></header><div id="content" class="content"></div></main></div>
<div id="clientModal" class="modal hidden"><div class="modalbox"><div class="sectionhead"><h2 id="modalTitle">Novo cliente</h2><button class="btn secondary" onclick="closeClient()">Fechar</button></div><input id="clientId" type="hidden"><div class="row"><div class="field"><label>Nome *</label><input id="clientName"></div><div class="field"><label>Telefone</label><input id="clientPhone"></div></div><div class="field"><label>Endereço completo</label><input id="clientAddress"></div><div class="row"><div class="field"><label>Origem</label><input id="clientOrigin" value="manual"></div><div></div></div><div class="field"><label>Observações</label><textarea id="clientNotes"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeClient()">Cancelar</button><button id="saveClientBtn" class="btn primary">Salvar cliente</button></div><div id="clientMsg" class="msg"></div></div></div>

<div id="productModal" class="modal hidden"><div class="modalbox"><div class="sectionhead"><h2 id="productModalTitle">Novo produto</h2><button class="btn secondary" onclick="closeProduct()">Fechar</button></div><input id="productId" type="hidden"><div class="row"><div class="field"><label>Nome *</label><input id="productName"></div><div class="field"><label>Unidade *</label><input id="productUnit" placeholder="kg, litro, unidade..."></div></div><div class="row"><div class="field"><label>Estoque atual</label><input id="productStock" type="number" step="0.01"></div><div class="field"><label>Estoque mínimo</label><input id="productMin" type="number" step="0.01"></div></div><div class="row"><div class="field"><label>Valor de custo</label><input id="productCost" type="number" step="0.01"></div><div class="field"><label>Valor varejo</label><input id="productRetail" type="number" step="0.01"></div></div><div class="field"><label>Valor atacado</label><input id="productWholesale" type="number" step="0.01"></div><div class="field"><label>Foto do produto (máx. 5 MB)</label><input id="productPhoto" type="file" accept="image/*"><img id="productPreview" class="preview hidden"></div><div class="actions"><button class="btn secondary" onclick="closeProduct()">Cancelar</button><button id="saveProductBtn" class="btn primary">Salvar produto</button></div><div id="productMsg" class="msg"></div></div></div>
<div id="assetModal" class="modal hidden"><div class="modalbox"><div class="sectionhead"><h2 id="assetModalTitle">Novo ativo</h2><button class="btn secondary" onclick="closeAsset()">Fechar</button></div><input id="assetId" type="hidden"><div class="row"><div class="field"><label>Nome do equipamento *</label><input id="assetName"></div><div class="field"><label>Código interno</label><input id="assetCode"></div></div><div class="row"><div class="field"><label>Código de barras</label><input id="assetBarcode"></div><div class="field"><label>Fornecedor</label><input id="assetSupplier"></div></div><div class="row"><div class="field"><label>Data da compra</label><input id="assetPurchaseDate" type="date"></div><div class="field"><label>Valor da compra</label><input id="assetPurchaseValue" type="number" step="0.01"></div></div><div class="row"><div class="field"><label>Locação tabela 1</label><input id="assetRent1" type="number" step="0.01"></div><div class="field"><label>Locação tabela 2</label><input id="assetRent2" type="number" step="0.01"></div></div><div class="row"><div class="field"><label>Peso (kg)</label><input id="assetWeight" type="number" step="0.01"></div><div class="field"><label>Possui case?</label><select id="assetCase"><option value="false">Não</option><option value="true">Sim</option></select></div></div><div class="field"><label>Foto do ativo (máx. 5 MB)</label><input id="assetPhoto" type="file" accept="image/*"><img id="assetPreview" class="preview hidden"></div><div class="field"><label>Observações</label><textarea id="assetNotes"></textarea></div><div class="actions"><button class="btn secondary" onclick="closeAsset()">Cancelar</button><button id="saveAssetBtn" class="btn primary">Salvar ativo</button></div><div id="assetMsg" class="msg"></div></div></div>
<script>
const SUPABASE_URL='https://locvpksjntwnlqrytqqx.supabase.co';
const SUPABASE_KEY='sb_publishable_UN34ALY6Oxc1_V863pgq3Q_hNj7tuIQ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s); let clients=[],products=[],assets=[];
const modules=['Dashboard','Clientes','Orçamentos','Contratos','Eventos','Estoque','Ativos / Equipamentos','Colaboradores','Manutenção','Financeiro / DRE','Agenda','Relatórios','Configurações'];
$('#nav').innerHTML=modules.map((m,i)=>`<button data-i="${i}" class="${i===0?'active':''}">${m}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderModule(+b.dataset.i)};
async function boot(){const {data:{session}}=await db.auth.getSession();session?showApp(session.user):showLogin()}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}
async function showApp(user){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#userName').textContent=user.email||'';renderModule(0)}
$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;$('#loginMsg').textContent='Entrando...';const {data,error}=await db.auth.signInWithPassword({email,password});if(error){$('#loginMsg').textContent='Não foi possível entrar: '+error.message;return}$('#loginMsg').textContent='';showApp(data.user)};
$('#logoutBtn').onclick=async()=>{await db.auth.signOut();showLogin()};
  async function recuperarSenha(){
  const email = $('#email').value.trim();
  if(!email){
    $('#loginMsg').textContent='Digite seu e-mail primeiro.';
    return;
  }
  const {error}=await db.auth.resetPasswordForEmail(email,{
    redirectTo:'https://cz-efeitos-especiais.vercel.app'
  });
  $('#loginMsg').textContent=error
    ? 'Erro: '+error.message
    : 'Link de recuperação enviado para seu e-mail.';
}
async function renderModule(i){$('#pageTitle').textContent=modules[i];if(i===0)return renderDashboard();if(i===1)return renderClients();if(i===5)return renderProducts();if(i===6)return renderAssets();$('#content').innerHTML=`<div class="sectionhead"><h2>${modules[i]}</h2></div><div class="placeholder">Módulo já previsto no banco de dados. A tela operacional será ativada nas próximas versões sem precisar recriar sua estrutura.</div>`}
async function count(table){const {count,error}=await db.from(table).select('*',{count:'exact',head:true});return error?'—':count}
async function renderDashboard(){const c=await Promise.all([count('clientes'),count('eventos'),count('ativos'),count('produtos')]);$('#content').innerHTML=`<div class="sectionhead"><div><h2>Visão geral</h2><div class="muted">Resumo da operação</div></div></div><div class="cards"><div class="card"><div class="muted">Clientes</div><div class="n">${c[0]}</div></div><div class="card"><div class="muted">Eventos</div><div class="n">${c[1]}</div></div><div class="card"><div class="muted">Ativos</div><div class="n">${c[2]}</div></div><div class="card"><div class="muted">Produtos</div><div class="n">${c[3]}</div></div></div><div class="card" style="margin-top:14px"><b>Próximos passos</b><p class="muted">Cadastre seus clientes. Nas próximas telas, o cadastro será ligado diretamente a orçamentos, eventos, estoque, ativos e financeiro.</p></div>`}
async function renderClients(){const {data,error}=await db.from('clientes').select('*').order('criado_em',{ascending:false});if(error){$('#content').innerHTML=`<div class="msg">Erro ao carregar clientes: ${error.message}</div>`;return}clients=data||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Clientes</h2><div class="muted">${clients.length} cliente(s) cadastrado(s)</div></div><button class="btn primary" onclick="openClient()">+ Novo cliente</button></div><div class="tablewrap">${clients.length?`<table><thead><tr><th>Nome</th><th>Telefone</th><th>Origem</th><th>Endereço</th><th>Ações</th></tr></thead><tbody>${clients.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.telefone||'')}</td><td>${esc(c.origem||'')}</td><td>${esc(c.endereco||'')}</td><td><button class="btn secondary" onclick="editClient('${c.id}')">Editar</button> <button class="btn danger" onclick="deleteClient('${c.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Nenhum cliente cadastrado.</div>`}</div>`}
function esc(v){return String(v).replace(/[&<>'"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[a]))}
function openClient(c=null){$('#clientModal').classList.remove('hidden');$('#modalTitle').textContent=c?'Editar cliente':'Novo cliente';$('#clientId').value=c?.id||'';$('#clientName').value=c?.nome||'';$('#clientPhone').value=c?.telefone||'';$('#clientAddress').value=c?.endereco||'';$('#clientOrigin').value=c?.origem||'manual';$('#clientNotes').value=c?.observacoes||'';$('#clientMsg').textContent=''}
function closeClient(){$('#clientModal').classList.add('hidden')}
function editClient(id){openClient(clients.find(c=>c.id===id))}
$('#saveClientBtn').onclick=async()=>{const id=$('#clientId').value,payload={nome:$('#clientName').value.trim(),telefone:$('#clientPhone').value.trim()||null,endereco:$('#clientAddress').value.trim()||null,origem:$('#clientOrigin').value.trim()||'manual',observacoes:$('#clientNotes').value.trim()||null,atualizado_em:new Date().toISOString()};if(!payload.nome){$('#clientMsg').textContent='Informe o nome do cliente.';return}const q=id?db.from('clientes').update(payload).eq('id',id):db.from('clientes').insert(payload);const {error}=await q;if(error){$('#clientMsg').textContent='Erro: '+error.message;return}closeClient();renderClients()};
async function deleteClient(id){if(!confirm('Excluir este cliente?'))return;const {error}=await db.from('clientes').delete().eq('id',id);if(error){alert('Não foi possível excluir: '+error.message);return}renderClients()}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function uploadPhoto(file,folder){if(!file)return null;if(file.size>5*1024*1024)throw new Error('A foto deve ter no máximo 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${folder}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('fotos').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;return db.storage.from('fotos').getPublicUrl(path).data.publicUrl}
async function renderProducts(){const {data,error}=await db.from('produtos').select('*').order('nome');if(error){$('#content').innerHTML=`<div class="msg">Erro ao carregar produtos: ${error.message}</div>`;return}products=data||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Estoque / Produtos</h2><div class="muted">${products.length} produto(s)</div></div><button class="btn primary" onclick="openProduct()">+ Novo produto</button></div><div class="tablewrap">${products.length?`<table><thead><tr><th>Foto</th><th>Produto</th><th>Unidade</th><th>Estoque</th><th>Mínimo</th><th>Custo</th><th>Varejo</th><th>Ações</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.foto_url?`<img class="thumb" src="${esc(p.foto_url)}">`:'—'}</td><td>${esc(p.nome)}</td><td>${esc(p.unidade||'')}</td><td>${p.estoque_atual??0}</td><td>${p.estoque_minimo??0}</td><td>${money(p.valor_custo)}</td><td>${money(p.valor_varejo)}</td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Editar</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Nenhum produto cadastrado.</div>`}</div>`}
function openProduct(p=null){$('#productModal').classList.remove('hidden');$('#productModalTitle').textContent=p?'Editar produto':'Novo produto';$('#productId').value=p?.id||'';$('#productName').value=p?.nome||'';$('#productUnit').value=p?.unidade||'unidade';$('#productStock').value=p?.estoque_atual??0;$('#productMin').value=p?.estoque_minimo??0;$('#productCost').value=p?.valor_custo??0;$('#productRetail').value=p?.valor_varejo??0;$('#productWholesale').value=p?.valor_atacado??0;$('#productPhoto').value='';const im=$('#productPreview');if(p?.foto_url){im.src=p.foto_url;im.classList.remove('hidden')}else im.classList.add('hidden');$('#productMsg').textContent=''}
function closeProduct(){$('#productModal').classList.add('hidden')}
function editProduct(id){openProduct(products.find(p=>p.id===id))}
$('#productPhoto').onchange=e=>{const f=e.target.files[0];if(f){$('#productPreview').src=URL.createObjectURL(f);$('#productPreview').classList.remove('hidden')}};
$('#saveProductBtn').onclick=async()=>{const id=$('#productId').value;$('#productMsg').textContent='Salvando...';try{let foto_url=id?products.find(p=>p.id===id)?.foto_url:null;const f=$('#productPhoto').files[0];if(f)foto_url=await uploadPhoto(f,'produtos');const payload={nome:$('#productName').value.trim(),unidade:$('#productUnit').value.trim()||'unidade',estoque_atual:+$('#productStock').value||0,estoque_minimo:+$('#productMin').value||0,valor_custo:+$('#productCost').value||0,valor_varejo:+$('#productRetail').value||0,valor_atacado:+$('#productWholesale').value||0,foto_url,atualizado_em:new Date().toISOString()};if(!payload.nome)throw new Error('Informe o nome do produto.');const {error}=await(id?db.from('produtos').update(payload).eq('id',id):db.from('produtos').insert(payload));if(error)throw error;closeProduct();renderProducts()}catch(e){$('#productMsg').textContent='Erro: '+e.message}};
async function renderAssets(){const {data,error}=await db.from('ativos').select('*').order('nome');if(error){$('#content').innerHTML=`<div class="msg">Erro ao carregar ativos: ${error.message}</div>`;return}assets=data||[];$('#content').innerHTML=`<div class="sectionhead"><div><h2>Ativos / Equipamentos</h2><div class="muted">${assets.length} ativo(s)</div></div><button class="btn primary" onclick="openAsset()">+ Novo ativo</button></div><div class="tablewrap">${assets.length?`<table><thead><tr><th>Foto</th><th>Equipamento</th><th>Código</th><th>Cód. barras</th><th>Compra</th><th>Valor compra</th><th>Status</th><th>Ações</th></tr></thead><tbody>${assets.map(a=>`<tr><td>${a.foto_url?`<img class="thumb" src="${esc(a.foto_url)}">`:'—'}</td><td>${esc(a.nome)}</td><td>${esc(a.codigo_interno||'')}</td><td>${esc(a.codigo_barras||'')}</td><td>${a.data_compra?new Date(a.data_compra+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td><td>${money(a.valor_compra)}</td><td>${esc(a.status||'')}</td><td><button class="btn secondary" onclick="editAsset('${a.id}')">Editar</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Nenhum ativo cadastrado.</div>`}</div>`}
function openAsset(a=null){$('#assetModal').classList.remove('hidden');$('#assetModalTitle').textContent=a?'Editar ativo':'Novo ativo';$('#assetId').value=a?.id||'';$('#assetName').value=a?.nome||'';$('#assetCode').value=a?.codigo_interno||'';$('#assetBarcode').value=a?.codigo_barras||'';$('#assetSupplier').value=a?.fornecedor||'';$('#assetPurchaseDate').value=a?.data_compra||'';$('#assetPurchaseValue').value=a?.valor_compra??0;$('#assetRent1').value=a?.valor_locacao_tabela1??0;$('#assetRent2').value=a?.valor_locacao_tabela2??0;$('#assetWeight').value=a?.peso??'';$('#assetCase').value=String(a?.possui_case??false);$('#assetNotes').value=a?.observacoes||'';$('#assetPhoto').value='';const im=$('#assetPreview');if(a?.foto_url){im.src=a.foto_url;im.classList.remove('hidden')}else im.classList.add('hidden');$('#assetMsg').textContent=''}
function closeAsset(){$('#assetModal').classList.add('hidden')}
function editAsset(id){openAsset(assets.find(a=>a.id===id))}
$('#assetPhoto').onchange=e=>{const f=e.target.files[0];if(f){$('#assetPreview').src=URL.createObjectURL(f);$('#assetPreview').classList.remove('hidden')}};
$('#saveAssetBtn').onclick=async()=>{const id=$('#assetId').value;$('#assetMsg').textContent='Salvando...';try{let foto_url=id?assets.find(a=>a.id===id)?.foto_url:null;const f=$('#assetPhoto').files[0];if(f)foto_url=await uploadPhoto(f,'ativos');const payload={nome:$('#assetName').value.trim(),codigo_interno:$('#assetCode').value.trim()||null,codigo_barras:$('#assetBarcode').value.trim()||null,fornecedor:$('#assetSupplier').value.trim()||null,data_compra:$('#assetPurchaseDate').value||null,valor_compra:+$('#assetPurchaseValue').value||0,valor_locacao_tabela1:+$('#assetRent1').value||0,valor_locacao_tabela2:+$('#assetRent2').value||0,peso:$('#assetWeight').value?+$('#assetWeight').value:null,possui_case:$('#assetCase').value==='true',observacoes:$('#assetNotes').value.trim()||null,foto_url,atualizado_em:new Date().toISOString()};if(!payload.nome)throw new Error('Informe o nome do equipamento.');const {error}=await(id?db.from('ativos').update(payload).eq('id',id):db.from('ativos').insert(payload));if(error)throw error;closeAsset();renderAssets()}catch(e){$('#assetMsg').textContent='Erro: '+e.message}};

boot();
</script></body></html>
