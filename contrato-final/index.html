<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrato final | CZ Efeitos Especiais</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0f16;color:white;font-family:Arial,sans-serif;padding:16px;box-sizing:border-box}.box{max-width:500px;width:100%;border:1px solid #344051;background:#141c27;padding:28px;border-radius:16px;text-align:center}h1{color:#ff641f}button{background:#ff641f;color:white;border:0;border-radius:9px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer}#erro{color:#ffb4b4}</style></head><body><div class="box"><h1>CZ EFEITOS ESPECIAIS</h1><h2>Contrato final assinado</h2><p>Documento assinado pelo cliente e pela contratada.</p><p id="estado">Verificando seu link...</p><button id="abrir" hidden>Abrir PDF final</button><p id="erro"></p><small>O link é individual e tem validade de 30 dias. Não compartilhe com terceiros.</small></div><script>
const endpoint='https://locvpksjntwnlqrytqqx.supabase.co/functions/v1/contrato-assinatura';
const token=new URLSearchParams(location.search).get('token');
const estado=document.getElementById('estado'),btn=document.getElementById('abrir'),erro=document.getElementById('erro');
if(!/^[a-f0-9]{64}$/i.test(token||'')){estado.textContent='Link inválido.'}else{estado.textContent='Link disponível. Clique para abrir o PDF.';btn.hidden=false;btn.onclick=async()=>{btn.disabled=true;erro.textContent='';estado.textContent='Preparando documento...';const janela=window.open('','_blank');try{const resp=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'final-view',token})});const data=await resp.json();if(!resp.ok||!data.pdf_url)throw new Error(data.error||'Não foi possível abrir o documento.');const url=new URL(data.pdf_url);if(url.protocol!=='https:')throw new Error('Endereço inválido.');if(janela)janela.location.replace(url.href);else location.href=url.href;estado.textContent='Documento aberto. Você pode visualizar ou salvar o PDF.'}catch(e){if(janela)janela.close();estado.textContent='Não foi possível abrir.';erro.textContent=e.message||String(e)}finally{btn.disabled=false}}}
</script></body></html>
